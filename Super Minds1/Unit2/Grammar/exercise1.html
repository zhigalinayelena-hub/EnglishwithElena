<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 1 • Super Minds 1 • Unit 2 • Grammar</title>
<style>
*{box-sizing:border-box}
:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}
body{margin:0;min-height:100vh}
.container{max-width:1000px;margin:auto;padding:38px 22px 48px;text-align:center}
h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 8px}
.subtitle{color:#5f6d7a;font-size:1.1rem;margin:0 0 25px}
.exercise-title{font-size:clamp(1.55rem,4vw,2.2rem);margin:0 0 20px}
.student-entry{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 20px;font-weight:bold}
input{border:2px solid #c9d8eb;border-radius:12px;padding:10px 12px;font:inherit;color:#1f3552}
input:focus{outline:3px solid #b9d5ff;border-color:#2869d8}
.student-entry input{min-width:220px;max-width:100%;width:300px}
.scorebar{position:sticky;top:10px;z-index:2;width:max-content;max-width:100%;margin:0 auto 20px;padding:10px 18px;background:#fff;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,.08);font-size:1.15rem;font-weight:bold}
.exercise{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 20px rgba(0,0,0,.08);text-align:left}
.word-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 auto 24px;padding:14px 18px;border:3px solid #00afd0;border-radius:22px;max-width:720px}
.word-bank span{background:#eaf3ff;border:2px solid #c9ddfa;border-radius:14px;padding:7px 14px;font-weight:bold;font-size:1.15rem}
.items{display:grid;gap:15px;max-width:780px;margin:auto}
.item{padding:15px 18px;background:#f8fbff;border-radius:18px;border:1px solid #e1eaf5}
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:clamp(1.2rem,2.6vw,1.65rem);line-height:1.8;color:#201d20}
.number{font-weight:bold;color:#77c900;margin-right:4px}
.blank-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:4px;vertical-align:middle}
.blank{width:clamp(104px,14vw,145px);padding:5px 8px;text-align:center;font-size:1.05rem;font-weight:bold;border-width:0 0 3px;border-radius:0;background:transparent}
.blank.correct{border-color:#168447;background:#e6f7ec}.blank.wrong{border-color:#c33a3a;background:#fff0ed}
.check-one{border:0;border-radius:10px;background:#2869d8;color:#fff;padding:7px 12px;font:inherit;font-size:.88rem;font-weight:bold;cursor:pointer}
.check-one:hover{background:#1d55b7}.check-one:focus-visible,.action:focus-visible,.back:focus-visible{outline:3px solid #f5bd38;outline-offset:3px}
.feedback{min-height:1.3em;font-size:.88rem;font-weight:bold}.feedback.correct{color:#168447}.feedback.wrong{color:#c33a3a}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px auto 0}
button.action{border:0;border-radius:14px;background:#2869d8;color:#fff;padding:12px 23px;font:inherit;font-weight:bold;cursor:pointer}
button.action:hover{background:#1d55b7}button.reset{background:#f2a900;color:#253653}button.reset:hover{background:#df9700}
#submitResults{display:none}#submitResults.visible{display:inline-block}#submitResults:disabled{opacity:.78;cursor:default}
.result{display:none;margin:18px auto 0;padding:17px 20px;max-width:100%;background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);font-size:1.2rem;font-weight:bold;text-align:center;color:#1f3552}
.result.show{display:block}.positive{display:none;color:#168447;margin-top:8px}.positive.show{display:block}
.submission-status{margin:12px auto 0;text-align:center;font-size:1rem;font-weight:bold}.submission-status.success{color:#168447}.submission-status.error{color:#bd3838}
.back{display:block;width:max-content;margin:27px auto 0;padding:12px 22px;border-radius:16px;background:#2869d8;color:#fff;text-decoration:none;font-weight:bold}
@media(max-width:600px){.container{padding:26px 13px 36px}.exercise{padding:16px 12px}.item{padding:12px}.word-bank{gap:7px;padding:10px 8px}.word-bank span{padding:6px 10px}.blank{width:100px}}
</style>
</head>
<body>
<main class="container">
  <h1>✏️ Super Minds 1 • Unit 2</h1>
  <p class="subtitle">Grammar</p>
  <h2 class="exercise-title">Complete the sentences with the words from the box.</h2>
  <div class="student-entry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name"></div>
  <div class="scorebar" aria-live="polite">Score: <span id="score">0</span> / 6</div>
  <section class="exercise" aria-label="Complete the sentences">
    <div class="word-bank" aria-label="Words from the box"><span>favourite</span><span>her</span><span>She's</span><span>What's</span><span>name</span><span>she</span></div>
    <div class="items">
      <div class="item">
        <div class="sentence"><span class="number">1.</span><span>What's</span><span class="blank-wrap"><input class="blank" aria-label="Item 1 blank 1" autocomplete="off" data-answer="her"><button type="button" class="check-one">Check</button><span class="feedback" aria-live="polite"></span></span><span>name?</span></div>
        <div class="sentence"><span>Her</span><span class="blank-wrap"><input class="blank" aria-label="Item 1 blank 2" autocomplete="off" data-answer="name"><button type="button" class="check-one">Check</button><span class="feedback" aria-live="polite"></span></span><span>'s Sophie.</span></div>
      </div>
      <div class="item">
        <div class="sentence"><span class="number">2.</span><span class="blank-wrap"><input class="blank" aria-label="Item 2 blank 1" autocomplete="off" data-answer="What's"><button type="button" class="check-one">Check</button><span class="feedback" aria-live="polite"></span></span><span>her favourite toy?</span></div>
        <div class="sentence"><span>Her</span><span class="blank-wrap"><input class="blank" aria-label="Item 2 blank 2" autocomplete="off" data-answer="favourite"><button type="button" class="check-one">Check</button><span class="feedback" aria-live="polite"></span></span><span>toy's her go-kart.</span></div>
      </div>
      <div class="item">
        <div class="sentence"><span class="number">3.</span><span>How old is</span><span class="blank-wrap"><input class="blank" aria-label="Item 3 blank 1" autocomplete="off" data-answer="she"><button type="button" class="check-one">Check</button><span class="feedback" aria-live="polite"></span></span><span>?</span></div>
        <div class="sentence"><span class="blank-wrap"><input class="blank" aria-label="Item 3 blank 2" autocomplete="off" data-answer="She's"><button type="button" class="check-one">Check</button><span class="feedback" aria-live="polite"></span></span><span>seven.</span></div>
      </div>
    </div>
    <div class="actions"><button class="action reset" id="tryAgain" type="button">Try Again</button><button class="action" id="submitResults" type="button">Submit Results</button></div>
    <div class="result" id="result" aria-live="polite"><div id="resultScore"></div><div class="positive" id="positive">🌟 Fantastic! All 6 answers are correct! 🌟</div><div class="submission-status" id="submissionStatus" aria-live="polite"></div></div>
  </section>
  <a class="back" href="index.html">← Back to Grammar</a>
</main>
<script>
const blanks=[...document.querySelectorAll('.blank')];
const scoreEl=document.getElementById('score');
const result=document.getElementById('result');
const resultScore=document.getElementById('resultScore');
const positive=document.getElementById('positive');
const submitButton=document.getElementById('submitResults');
const submissionStatus=document.getElementById('submissionStatus');
const studentName=document.getElementById('studentName');
const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
let submissionInProgress=false,submittedPayload=null;
function normalize(value){return value.trim().toLowerCase()}
function update(){const checked=blanks.filter(input=>input.dataset.checked==='true').length;scoreEl.textContent=checked;const done=blanks.every(input=>input.dataset.checked!==undefined);result.classList.toggle('show',done);submitButton.classList.toggle('visible',done);if(done){resultScore.textContent=`Your score: ${checked} / 6`;positive.classList.toggle('show',checked===6)}}
function check(input){const ok=normalize(input.value)===normalize(input.dataset.answer);input.dataset.checked=String(ok);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);const feedback=input.parentElement.querySelector('.feedback');feedback.textContent=ok?'✓ Correct!':'Try again';feedback.className=`feedback ${ok?'correct':'wrong'}`;update()}
blanks.forEach(input=>{input.parentElement.querySelector('.check-one').addEventListener('click',()=>check(input));input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();check(input)}});input.addEventListener('input',()=>{delete input.dataset.checked;input.classList.remove('correct','wrong');const feedback=input.parentElement.querySelector('.feedback');feedback.textContent='';feedback.className='feedback';submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';submissionStatus.className='submission-status';result.classList.remove('show');submitButton.classList.remove('visible');positive.classList.remove('show');update()})});
document.getElementById('tryAgain').addEventListener('click',()=>{blanks.forEach(input=>{input.value='';delete input.dataset.checked;input.classList.remove('correct','wrong');const feedback=input.parentElement.querySelector('.feedback');feedback.textContent='';feedback.className='feedback'});scoreEl.textContent='0';result.classList.remove('show');positive.classList.remove('show');submitButton.classList.remove('visible');submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';submissionStatus.className='submission-status';blanks[0].focus()});
submitButton.addEventListener('click',async()=>{if(submissionInProgress||submitButton.disabled)return;const name=studentName.value.trim();if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status error';return}const answers=blanks.map((input,index)=>`${index+1}: ${input.value.trim()}`).join('; ');const data=new URLSearchParams({student:name,unit:'Unit 2',section:'Grammar',exercise:'Exercise 1',answers,score:`${scoreEl.textContent}/6`});const payload=data.toString();submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='Submitting results…';submissionStatus.className='submission-status';try{const response=await fetch(webAppUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(!response.ok)throw new Error('Submission failed');submittedPayload=payload;submitButton.textContent='✓ Results Submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status success'}catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status error';submitButton.disabled=false}finally{submissionInProgress=false}});
</script>
</body>
</html>
