<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 3: Write and match • Super Minds 1 • Unit 1</title>
<style>
*{box-sizing:border-box}:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}body{margin:0;min-height:100vh}.container{max-width:1000px;margin:auto;padding:34px 22px 48px;text-align:center}.exercise-title{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 8px}.subtitle{color:#5f6d7a;font-size:1.15rem;margin:0 0 10px}.instructions{font-size:1.15rem;margin:0 auto 16px;line-height:1.5}.student-entry{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 20px;font-weight:bold}.student-entry input{min-width:220px;max-width:100%;flex:0 1 300px}input{border:2px solid #c9d8eb;border-radius:10px;padding:8px;font:inherit;color:#1f3552}input:focus{outline:3px solid #b9d5ff;border-color:#2869d8}.worksheet{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 20px rgba(0,0,0,.08);text-align:left}.worksheet h2{text-align:center;font-size:1.55rem;margin:0 0 20px}.columns{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:28px}.items{list-style:none;padding:0;margin:0;display:grid;gap:17px}.item{display:grid;grid-template-columns:32px minmax(0,1fr) 112px;gap:8px;align-items:center;font-size:1.2rem;font-weight:bold}.number{text-align:center}.phrase{display:flex;align-items:center;flex-wrap:wrap;gap:3px}.letter-input{width:53px;text-align:center;padding:6px 3px;font-weight:bold;font-size:1.1rem}.letter-input.short{width:44px}.match{display:flex;align-items:center;gap:7px;white-space:nowrap}.match input{width:48px;text-align:center;text-transform:lowercase;font-weight:bold}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}.picture{min-height:128px;border:2px solid #dbe7f5;border-radius:16px;background:#f5f9ff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;position:relative}.picture-letter{position:absolute;top:6px;left:9px;font-weight:bold;font-size:1.1rem;color:#2869d8}.picture svg{width:84px;height:76px}.picture figcaption{font-size:.9rem;color:#5f6d7a;margin-top:3px}.actions{text-align:center;margin-top:20px}button{border:0;border-radius:12px;background:#2869d8;color:#fff;padding:11px 18px;font:inherit;font-weight:bold;cursor:pointer}button:hover{background:#1d55b7}button:focus-visible,.back:focus-visible{outline:3px solid #f5bd38;outline-offset:3px}.score{font-size:1.18rem;font-weight:bold;margin:16px 0 0}.feedback{min-height:1.35em;margin:5px 0 0;font-size:.9rem;font-weight:bold}.feedback.correct{color:#168447}.feedback.wrong{color:#c33a3a}.final{display:none;margin:18px auto 0;padding:18px;background:#fff;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.08);font-size:1.2rem;font-weight:bold}.final.show{display:block}.submit-results{display:none;margin:12px 8px 0}.submit-results.visible{display:inline-block}.again{margin:12px 8px 0;background:#f2a900;color:#253653}.again:hover{background:#df9700}.submission-status{margin:12px auto 0;font-size:1rem;font-weight:bold}.submission-status.success{display:block;margin:12px auto 0;padding:12px 16px;border:2px solid #168447;border-radius:12px;background:#e6f7ec;color:#126b3c;font-size:1.15rem}.submission-status.error{color:#c33a3a}.back{display:block;width:max-content;margin:26px auto 0;background:#2869d8;color:#fff;padding:12px 22px;border-radius:16px;text-decoration:none;font-weight:bold}
@media(max-width:680px){.container{padding:26px 14px 36px}.worksheet{padding:18px}.columns{grid-template-columns:1fr;gap:24px}.items{gap:13px}.item{grid-template-columns:28px minmax(0,1fr) 80px;font-size:1.05rem}.letter-input{width:44px}.letter-input.short{width:38px}.match input{width:42px}.picture{min-height:116px}}
</style>
</head>
<body>
<main class="container">
  <h1 class="exercise-title">✍️ Super Minds 1 • Unit 1</h1>
  <p class="subtitle">Writing</p>
  <h2 class="exercise-title">Exercise 3: Write and match. Listen and say.</h2>
  <p class="instructions">Write the missing letters. Then write the picture letter.</p>
  <div class="student-entry"><label for="studentName">Student Name</label><input id="studentName" type="text" autocomplete="name"></div>
  <section class="worksheet" aria-labelledby="task-title">
    <h2 id="task-title">Write and match. Listen and say.</h2>
    <div class="columns">
      <ol class="items">
        <li class="item" data-word="cat" data-match="b"><span class="number">1.</span><label class="phrase" aria-label="A cat"><span>A c</span><input class="letter-input short" aria-label="Missing letters in cat" maxlength="2" autocomplete="off"><span>t</span></label><label class="match">→ <input aria-label="Picture letter for item 1" maxlength="1" autocomplete="off"></label><p class="feedback" aria-live="polite"></p></li>
        <li class="item" data-word="fat rat" data-match="d"><span class="number">2.</span><label class="phrase" aria-label="A fat rat"><span>A f</span><input class="letter-input short" aria-label="Missing letters in fat" maxlength="2" autocomplete="off"><span>t r</span><input class="letter-input short" aria-label="Missing letters in rat" maxlength="2" autocomplete="off"><span>t</span></label><label class="match">→ <input aria-label="Picture letter for item 2" maxlength="1" autocomplete="off"></label><p class="feedback" aria-live="polite"></p></li>
        <li class="item" data-word="black hat" data-match="c"><span class="number">3.</span><label class="phrase" aria-label="A black hat"><span>A bl</span><input class="letter-input" aria-label="Missing letters in black" maxlength="2" autocomplete="off"><span>ck h</span><input class="letter-input short" aria-label="Missing letters in hat" maxlength="2" autocomplete="off"><span>t</span></label><label class="match">→ <input aria-label="Picture letter for item 3" maxlength="1" autocomplete="off"></label><p class="feedback" aria-live="polite"></p></li>
        <li class="item" data-word="black bag" data-match="a"><span class="number">4.</span><label class="phrase" aria-label="A black bag"><span>A bl</span><input class="letter-input" aria-label="Missing letters in black" maxlength="2" autocomplete="off"><span>ck b</span><input class="letter-input short" aria-label="Missing letters in bag" maxlength="2" autocomplete="off"><span>g</span></label><label class="match">→ <input aria-label="Picture letter for item 4" maxlength="1" autocomplete="off"></label><p class="feedback" aria-live="polite"></p></li>
      </ol>
      <div class="pictures" aria-label="Pictures to match">
        <figure class="picture"><span class="picture-letter">a</span><svg viewBox="0 0 100 90" role="img" aria-label="Black backpack"><path d="M33 22v-5a17 17 0 0 1 34 0v5" fill="none" stroke="#39475a" stroke-width="5"/><rect x="22" y="20" width="56" height="62" rx="15" fill="#263342" stroke="#111c2a" stroke-width="4"/><path d="M29 42a10 10 0 0 1 10-10h22a10 10 0 0 1 10 10v28H29z" fill="#38495d" stroke="#111c2a" stroke-width="3"/><path d="M50 44v22m-8-11h16" stroke="#8493a5" stroke-width="3" stroke-linecap="round"/><path d="M17 37v27m66-27v27" stroke="#111c2a" stroke-width="5" stroke-linecap="round"/></svg></figure>
        <figure class="picture"><span class="picture-letter">b</span><svg viewBox="0 0 100 90" role="img" aria-label="Cat"><path d="M23 34 18 12l22 12m20 0 22-12-5 23" fill="#f2a65a" stroke="#925528" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="48" r="31" fill="#f2a65a" stroke="#925528" stroke-width="3"/><path d="M34 44h3m29 0h-3" stroke="#263342" stroke-width="5" stroke-linecap="round"/><path d="m46 53 4 4 4-4z" fill="#d86d79"/><path d="M50 57c-4 7-10 7-14 3m14-3c4 7 10 7 14 3" fill="none" stroke="#925528" stroke-width="2"/><path d="M25 53 9 49m17 10-17 3m66-9 16-4m-17 10 17 3" stroke="#925528" stroke-width="2"/></svg></figure>
        <figure class="picture"><span class="picture-letter">c</span><svg viewBox="0 0 100 90" role="img" aria-label="Black hat"><path d="M26 53c1-20 12-34 24-34s23 14 24 34" fill="#283746" stroke="#111c2a" stroke-width="4"/><path d="M15 53h70c-2 12-15 18-35 18S17 65 15 53z" fill="#39495d" stroke="#111c2a" stroke-width="4"/><path d="M29 53h42" stroke="#8493a5" stroke-width="4"/></svg></figure>
        <figure class="picture"><span class="picture-letter">d</span><svg viewBox="0 0 100 90" role="img" aria-label="Rat"><ellipse cx="49" cy="53" rx="28" ry="19" fill="#aab3bd" stroke="#65717f" stroke-width="3"/><circle cx="74" cy="45" r="14" fill="#aab3bd" stroke="#65717f" stroke-width="3"/><circle cx="70" cy="30" r="8" fill="#f3a4a9" stroke="#65717f" stroke-width="2"/><circle cx="80" cy="43" r="2.5" fill="#263342"/><path d="M22 55C9 52 9 68 2 68" fill="none" stroke="#d77c87" stroke-width="3" stroke-linecap="round"/><path d="M83 50h11m-10 4h10" stroke="#65717f" stroke-width="1.5"/><path d="M39 68v6m24-7v7" stroke="#65717f" stroke-width="3" stroke-linecap="round"/></svg></figure>
      </div>
    </div>
    <div class="actions"><button id="checkAll" type="button">Check</button><p class="score" aria-live="polite">Score: <span id="score">0</span> / 4</p></div>
  </section>
  <section class="final" id="final" aria-live="polite"><div id="finalScore"></div><button class="submit-results" id="submitResults" type="button">Submit Results</button><div class="submission-status" id="submissionStatus" aria-live="polite"></div><button class="again" id="again" type="button">Try again / Reset</button></section>
  <a class="back" href="index.html">← Back to Writing</a>
</main>
<script>
const items=[...document.querySelectorAll('.item')];
const scoreEl=document.getElementById('score'),final=document.getElementById('final'),finalScore=document.getElementById('finalScore');
const submitButton=document.getElementById('submitResults'),status=document.getElementById('submissionStatus'),studentName=document.getElementById('studentName');
const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
let submissionInProgress=false,submittedPayload=null;
function check(){let score=0;items.forEach(item=>{const letters=[...item.querySelectorAll('.phrase input')].map(input=>input.value.trim().toLowerCase());const match=item.querySelector('.match input').value.trim().toLowerCase();const correct=letters.length>0&&letters.every(letter=>letter==='a')&&match===item.dataset.match;item.dataset.checked=String(correct);if(correct)score++;const feedback=item.querySelector('.feedback');feedback.className=`feedback ${correct?'correct':'wrong'}`;feedback.textContent=correct?'✓ Correct!':'Try again.'});scoreEl.textContent=score;finalScore.textContent=`Your score: ${score} / 4`;final.classList.add('show');submitButton.classList.add('visible');status.textContent='';status.className='submission-status'}
document.getElementById('checkAll').addEventListener('click',check);
items.forEach(item=>item.querySelectorAll('input').forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter')check()})));
submitButton.addEventListener('click',async()=>{if(submissionInProgress||submitButton.disabled)return;const name=studentName.value.trim();if(!name){studentName.focus();status.textContent='Please enter your name.';status.className='submission-status error';return}const answers=items.map((item,index)=>{const word=[...item.querySelectorAll('.phrase input')].map(input=>input.value.trim()).join('');const match=item.querySelector('.match input').value.trim();return `${index+1}: ${word||'(blank)'}, ${match||'(blank)'}`}).join('; ');const data=new URLSearchParams({student:name,unit:'Unit 1',section:'Writing',exercise:'Exercise 3',answers,score:`${scoreEl.textContent}/4`});const payload=data.toString();if(payload===submittedPayload){submitButton.textContent='✓ Results submitted';submitButton.disabled=true;status.textContent='Results submitted successfully!';status.className='submission-status success';return}submissionInProgress=true;submitButton.disabled=true;status.textContent='';try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed');submittedPayload=payload;submitButton.textContent='✓ Results submitted';status.textContent='Results submitted successfully!';status.className='submission-status success'}catch(error){status.textContent='Sorry, the results could not be submitted. Please try again.';status.className='submission-status error';submitButton.disabled=false}finally{submissionInProgress=false}});
document.getElementById('again').addEventListener('click',()=>{items.forEach(item=>{delete item.dataset.checked;item.querySelectorAll('input').forEach(input=>input.value='');const feedback=item.querySelector('.feedback');feedback.textContent='';feedback.className='feedback'});scoreEl.textContent='0';final.classList.remove('show');submitButton.disabled=false;submitButton.textContent='Submit Results';submitButton.classList.remove('visible');status.textContent='';status.className='submission-status';items[0].querySelector('input').focus()});
</script>
</body>
</html>
