<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 3 — Write the words • Super Minds 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#201d20}
.container{max-width:1200px;margin:auto;padding:32px 22px 46px}
h1{text-align:center;font-size:clamp(1.9rem,4.5vw,3rem);margin:0 0 20px;color:#201d20}
.student-entry{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;font-weight:bold;color:#1f3552}.student-entry input{font:inherit;font-weight:normal;padding:9px 12px;border:2px solid #c9d8eb;border-radius:10px;min-width:220px}
.scorebar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:0 auto 20px;padding:10px 16px;background:#fff;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,.12);font-weight:bold;font-size:1.1rem;color:#1f3552}
.exercise{max-width:1040px;margin:auto;border:3px solid #00afd0;border-radius:26px;padding:22px 28px;background:#fff}
.heading-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;margin-bottom:14px}
.instruction{display:flex;align-items:center;gap:20px;font-size:clamp(1.45rem,3vw,2.15rem);font-weight:bold}.badge{display:grid;place-items:center;flex:0 0 58px;height:58px;border-radius:50%;background:#00afd0;color:#fff;font-size:1.8rem}
.word-bank{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,35px);padding:12px 22px;border:3px solid #00afd0;border-radius:24px;font-size:clamp(1.15rem,2.5vw,1.65rem);white-space:nowrap}.bank-word{font-weight:500;cursor:grab;touch-action:manipulation;border-radius:8px;padding:4px 5px}.bank-word:hover,.bank-word:focus-visible{background:#e9faff;outline:2px solid #00afd0}.bank-word.selected{background:#fff2bf;outline:2px solid #e2a900}.bank-word.used{color:#596376;text-decoration:line-through;cursor:default}
.content{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:12px;align-items:center}.sentences{padding:3px 0}.sentence{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin:14px 0;color:#201d20;font-size:clamp(1.2rem,2.7vw,1.8rem);line-height:1.65}.number{font-weight:bold;color:#77c900;margin-right:3px}.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:clamp(118px,17vw,188px);min-height:43px;border:0;border-bottom:3px solid #9ca1a5;color:#16429a;text-align:center;font-weight:bold}.gap.drop-target{cursor:pointer}.gap.drop-target:focus-visible{outline:3px solid #9fdafa}.gap .bank-word{font-size:inherit;cursor:grab}.gap.over{background:#effbff;border-color:#00afd0}.example{color:#16429a}
.penguin{width:100%;max-width:350px;justify-self:center}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px auto 0}button.action{border:0;border-radius:14px;background:#2869d8;color:#fff;padding:12px 24px;font:inherit;font-size:1.05rem;font-weight:bold;cursor:pointer}button.action:hover{background:#1d55b7}button.action:focus-visible,.back:focus-visible{outline:3px solid #f5bd38;outline-offset:3px}button#submitResults{display:none}button#submitResults.visible{display:inline-block}button#submitResults:disabled{opacity:.78;cursor:default}button.reset{background:#f2a900;color:#253653}button.reset:hover{background:#df9700}.result{display:none;margin:18px auto 0;padding:15px 20px;width:max-content;max-width:100%;background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);font-size:1.2rem;font-weight:bold;text-align:center;color:#1f3552}.result.show{display:block}.submission-status{margin:14px auto 0;text-align:center;font-size:1.1rem;font-weight:bold;color:#1f3552}.submission-status.success{color:#168447}.submission-status.error{color:#bd3838}.back{display:block;width:max-content;margin:27px auto 0;padding:12px 22px;border-radius:16px;background:#2869d8;color:#fff;text-decoration:none;font-weight:bold}
@media(max-width:760px){.heading-row{grid-template-columns:1fr}.word-bank{justify-content:space-around}.content{grid-template-columns:1fr}.penguin{max-width:250px;grid-row:1}.sentences{grid-row:2}.exercise{padding:18px 15px}.instruction{justify-content:center}.sentence{margin:12px 0}}
@media(max-width:420px){.container{padding:22px 12px 34px}.word-bank{gap:5px;padding:8px 5px}.bank-word{padding:4px 3px}.sentence{font-size:1.13rem}.gap{width:110px;min-height:38px}.badge{flex-basis:48px;height:48px;font-size:1.5rem}}
</style>
</head>
<body>
<main class="container">
  <h1>Exercise 3 — Write the words</h1>
  <div class="student-entry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name"></div>
  <div class="scorebar" aria-live="polite">Score: <span id="score">0</span> / 3</div>
  <section class="exercise" aria-label="Write the words exercise">
    <div class="heading-row">
      <div class="instruction"><span class="badge">1</span><span>Write the words.</span></div>
      <div class="word-bank" id="word-bank" aria-label="Word bank">
        <span class="bank-word" draggable="true" tabindex="0" data-word="get">get</span>
        <span class="bank-word" draggable="true" tabindex="0" data-word="Open">Open</span>
        <span class="bank-word used" aria-label="Sit, used in the example">Sit</span>
        <span class="bank-word" draggable="true" tabindex="0" data-word="Write">Write</span>
      </div>
    </div>
    <div class="content">
      <div class="sentences" aria-label="Sentences">
        <div class="sentence"><span class="number">(1)</span><span class="gap example" aria-label="Completed example: Sit">Sit</span><span>at your desk, please.</span></div>
        <div class="sentence"><span class="number">(2)</span><span>Now</span><span class="gap drop-target" data-number="2" tabindex="0" role="button" aria-label="Gap 2, Now a pen"></span><span>a pen.</span></div>
        <div class="sentence"><span class="number">(3)</span><span class="gap drop-target" data-number="3" tabindex="0" role="button" aria-label="Gap 3, your book, please"></span><span>your book, please.</span></div>
        <div class="sentence"><span class="number">(4)</span><span class="gap drop-target" data-number="4" tabindex="0" role="button" aria-label="Gap 4, one to ten"></span><span>one to ten.</span></div>
      </div>
      <svg class="penguin" viewBox="0 0 350 370" role="img" aria-label="A penguin wearing a yellow hat and holding a red pen">
        <ellipse cx="180" cy="344" rx="128" ry="12" fill="#e9f3f5"/>
        <path d="M91 334c-24-49-33-123-17-204C88 54 131 21 191 27c67 6 102 60 101 139-1 70-15 128-39 168z" fill="#006b88"/>
        <path d="M115 333c-17-63-17-129-4-193 8-39 32-68 72-69 43 0 69 32 76 76 10 61-3 135-35 186z" fill="#fbfcf7"/>
        <path d="M89 119c11-34 37-54 74-57l-6 20c-19 6-35 20-47 42z" fill="#c7f1f4"/>
        <path d="M74 171c-31 26-50 68-48 112 2 27 18 43 37 38 19-6 31-41 42-74z" fill="#006b88"/>
        <ellipse cx="146" cy="128" rx="33" ry="39" fill="#fff"/><ellipse cx="217" cy="128" rx="33" ry="39" fill="#fff"/>
        <ellipse cx="153" cy="132" rx="9" ry="12" fill="#16161b"/><ellipse cx="211" cy="132" rx="9" ry="12" fill="#16161b"/>
        <path d="M178 143c-14 7-26 22-22 33 3 10 17 7 24 0 10 3 21 7 25-1 5-10-9-23-27-32z" fill="#ffad00"/>
        <path d="M144 91q-13 3-21 14m119-14q13 3 21 14" fill="none" stroke="#08a8c8" stroke-width="5"/>
        <path d="M110 83q-4-42 12-59 13-17 30 1 28-26 46 0 25-20 41 3 18-3 23 20l-2 48q-73-30-154-1z" fill="#ffc21b" stroke="#f4a900" stroke-width="4"/>
        <path d="M113 52h145M151 28l-2 35m48-42 1 43m38-32 8 34" stroke="#f29c00" stroke-width="3" fill="none"/>
        <path d="M40 209l-23 42 15 9 27-41z" fill="#f12c39" stroke="#d82030" stroke-width="3"/>
        <path d="M40 209l11 7-27 44-11-9z" fill="#ff5260"/><path d="M20 250l-5 13 12-4" fill="#333"/>
        <path d="M84 241c-17 20-18 54-5 82 12 25 28 24 40 3l13-27z" fill="#006b88"/>
        <path d="M125 347q-23 10-43 1m167 0q22 12 43 1" stroke="#f6aa08" stroke-width="11" stroke-linecap="round"/>
        <path d="M126 75q35-19 77-8" fill="none" stroke="#fff" stroke-width="7" opacity=".35"/>
      </svg>
    </div>
    <div class="actions"><button class="action" id="check" type="button">Check</button><button class="action reset" id="reset" type="button">Try again / Reset</button><button class="action" id="submitResults" type="button">Submit results</button></div>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="submission-status" id="submissionStatus" aria-live="polite"></div>
  </section>
  <a class="back" href="index.html">← Back to Games</a>
</main>
<script>
const bank=document.getElementById('word-bank');
const words=[...document.querySelectorAll('.bank-word[draggable="true"]')];
const gaps=[...document.querySelectorAll('.drop-target')];
const score=document.getElementById('score');
const result=document.getElementById('result');
const studentName=document.getElementById('studentName');
const submitButton=document.getElementById('submitResults');
const submissionStatus=document.getElementById('submissionStatus');
const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
const correct={2:'get',3:'Open',4:'Write'};
let dragged=null,selected=null,submissionInProgress=false,submittedPayload=null;
function clearCheckState(){score.textContent='0';result.textContent='';result.classList.remove('show');submitButton.classList.remove('visible');submissionStatus.textContent='';submissionStatus.className='submission-status'}
function useWord(word,gap){if(!word||!gap)return;const existing=gap.querySelector('.bank-word');if(existing)bank.appendChild(existing);gap.appendChild(word);word.classList.remove('selected');selected=null;gaps.forEach(item=>item.classList.remove('over'));clearCheckState()}
words.forEach(word=>{
 word.addEventListener('dragstart',event=>{dragged=word;event.dataTransfer.setData('text/plain',word.dataset.word);event.dataTransfer.effectAllowed='move'});
 word.addEventListener('dragend',()=>{dragged=null});
 word.addEventListener('click',()=>{if(selected===word){word.classList.remove('selected');selected=null;return}words.forEach(item=>item.classList.remove('selected'));selected=word;word.classList.add('selected')});
 word.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();word.click()}})
});
gaps.forEach(gap=>{
 gap.addEventListener('dragover',event=>{event.preventDefault();gap.classList.add('over')});
 gap.addEventListener('dragleave',()=>gap.classList.remove('over'));
 gap.addEventListener('drop',event=>{event.preventDefault();gap.classList.remove('over');const value=event.dataTransfer.getData('text/plain');useWord(words.find(word=>word.dataset.word===value)||dragged,gap)});
 gap.addEventListener('click',()=>{if(selected)useWord(selected,gap);else{const word=gap.querySelector('.bank-word');if(word){bank.appendChild(word);clearCheckState()}}});
 gap.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();gap.click()}})
});
document.getElementById('check').addEventListener('click',()=>{let total=0;gaps.forEach(gap=>{const chosen=gap.querySelector('.bank-word');gap.setAttribute('aria-label',`Gap ${gap.dataset.number}: ${chosen?chosen.dataset.word:'empty'}`);gap.style.background=chosen&&chosen.dataset.word===correct[gap.dataset.number]?'#e6f7ec':chosen?'#fff0ed':'#fff';if(chosen&&chosen.dataset.word===correct[gap.dataset.number])total++});score.textContent=total;result.textContent=`Your score: ${total} / 3`;result.classList.add('show');submitButton.classList.add('visible')});
submitButton.addEventListener('click',async()=>{if(submissionInProgress||submitButton.disabled)return;const name=studentName.value.trim();if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status error';return}const answers=gaps.map(gap=>`${gap.dataset.number}: ${gap.querySelector('.bank-word')?.dataset.word||'No selection'}`).join('; ');const data=new URLSearchParams({student:name,unit:'Unit 1',section:'Games',exercise:'Exercise 3',answers,score:`${score.textContent}/3`});const payload=data.toString();if(payload===submittedPayload){submitButton.textContent='✓ Results submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status success';return}submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';try{const response=await fetch(webAppUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(!response.ok)throw new Error(`Submission failed with status ${response.status}`);submittedPayload=payload;submitButton.textContent='✓ Results submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status success'}catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status error';submitButton.disabled=false}finally{submissionInProgress=false}});
document.getElementById('reset').addEventListener('click',()=>{words.forEach(word=>{bank.insertBefore(word,bank.querySelector('.used'));word.classList.remove('selected')});gaps.forEach(gap=>{gap.innerHTML='';gap.style.background='';gap.classList.remove('over')});selected=null;dragged=null;submitButton.disabled=false;submitButton.textContent='Submit results';clearCheckState()});
</script>
</body>
</html>
