
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Pack the Bag</title>
<style>
body{margin:0;font-family:Arial;background:#bfe9ff}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#bfe9ff 0%,#dff5ff 38%,#f4ead4 38%,#d8b383 100%)}
.board{position:absolute;left:8%;top:7%;width:48%;height:18%;background:#2d7d46;border:8px solid #9c6b38;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;text-align:center}
.window{position:absolute;right:6%;top:8%;width:20%;height:22%;background:#9dd8ff;border:6px solid #fff;border-radius:10px}
.window:before,.window:after{content:"";position:absolute;background:#fff}.window:before{width:4px;height:100%;left:50%}.window:after{height:4px;width:100%;top:50%}
.controls{position:absolute;top:28%;left:8%;display:flex;gap:12px;align-items:center}
button{padding:12px 20px;border:none;border-radius:999px;background:#2563eb;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}
#prompt{background:#fff;padding:12px 18px;border-radius:999px;font-size:1.1rem;font-weight:bold}
.item{position:absolute;width:92px;height:104px;background:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,.2);transition:.2s}
.item:hover{transform:scale(1.08)}.label{font-size:12px;font-weight:bold}
.product-image{width:68px;height:66px;background-image:url('assets/school-supplies-sprite.png');background-size:300% 300%;background-position:var(--x) var(--y);background-repeat:no-repeat;flex:none}
.locked{opacity:.45;cursor:not-allowed}.active{outline:4px solid #f59e0b;transform:scale(1.08)}
#bag{position:absolute;right:7%;bottom:8%;width:120px;height:120px;border-radius:28px;background:rgba(255,255,255,.2);border:3px dashed #fff;display:flex;align-items:center;justify-content:center;font-size:72px}
#counter{position:absolute;left:20px;bottom:20px;background:#fff;padding:10px 16px;border-radius:30px;font-weight:bold}
.fly{position:absolute;pointer-events:none;transition:all .9s cubic-bezier(.22,.8,.28,1)}
#done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:52px;font-weight:bold;flex-direction:column}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="board">🎒 Let's Pack the Bag!</div>
<div class="window"></div>
<div class="controls"><button id="listen">🔊 Listen</button><div id="prompt">Listen and click!</div></div>
<div class="item locked" data-word="pencil" data-x="0%" data-y="0%" style="left:10%;top:42%"><div class="product-image" style="--x:0%;--y:0%"></div><div class="label">pencil</div></div>
<div class="item locked" data-word="book" data-x="50%" data-y="0%" style="left:24%;top:52%"><div class="product-image" style="--x:50%;--y:0%"></div><div class="label">book</div></div>
<div class="item locked" data-word="ruler" data-x="100%" data-y="0%" style="left:39%;top:43%"><div class="product-image" style="--x:100%;--y:0%"></div><div class="label">ruler</div></div>
<div class="item locked" data-word="paper" data-x="100%" data-y="50%" style="left:54%;top:55%"><div class="product-image" style="--x:100%;--y:50%"></div><div class="label">paper</div></div>
<div class="item locked" data-word="pen" data-x="0%" data-y="50%" style="left:20%;top:72%"><div class="product-image" style="--x:0%;--y:50%"></div><div class="label">pen</div></div>
<div class="item locked" data-word="pencil case" data-x="50%" data-y="50%" style="left:38%;top:72%"><div class="product-image" style="--x:50%;--y:50%"></div><div class="label">pencil case</div></div>
<div class="item locked" data-word="notebook" data-x="0%" data-y="100%" style="left:56%;top:72%"><div class="product-image" style="--x:0%;--y:100%"></div><div class="label">notebook</div></div>
<div id="bag">🎒</div>
<div id="counter">Packed: <span id="count">0</span>/7</div>
<div id="done"><div>🌟 Great job!</div><div style="font-size:24px">Your bag is ready!</div></div>
</div>
<script>
const items=[...document.querySelectorAll('.item')],listen=document.getElementById('listen'),bag=document.getElementById('bag'),scene=document.getElementById('scene'),count=document.getElementById('count'),done=document.getElementById('done'),prompt=document.getElementById('prompt');
let packed=0,current=null,voice=null;
function loadVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/Google UK English Female/i.test(x.name))||v.find(x=>/Libby|Sonia|Hazel/i.test(x.name)&&x.lang==='en-GB')||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'))}loadVoice();speechSynthesis.onvoiceschanged=loadVoice;
function speak(word){const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';if(voice)u.voice=voice;u.rate=.88;u.pitch=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}
function next(){const left=items.filter(i=>!i.dataset.done);if(!left.length){done.style.display='flex';speak('Great job');current=null;return}current=left[Math.floor(Math.random()*left.length)];items.forEach(i=>{i.classList.add('locked');i.classList.remove('active')});current.classList.remove('locked');current.classList.add('active');prompt.textContent='Listen and click!'}
listen.onclick=()=>{if(!current)next();speak(current.dataset.word)};
items.forEach(it=>it.onclick=()=>{if(it!==current||it.dataset.done)return;const r=it.getBoundingClientRect(),s=scene.getBoundingClientRect(),b=bag.getBoundingClientRect();const f=document.createElement('div');f.className='fly product-image';f.style.setProperty('--x',it.dataset.x);f.style.setProperty('--y',it.dataset.y);f.style.left=(r.left-s.left+12)+'px';f.style.top=(r.top-s.top+12)+'px';scene.appendChild(f);it.style.visibility='hidden';it.dataset.done=1;requestAnimationFrame(()=>{f.style.left=(b.left-s.left+40)+'px';f.style.top=(b.top-s.top+30)+'px';f.style.transform='scale(.2) rotate(360deg)';f.style.opacity=0});setTimeout(()=>{f.remove();count.textContent=++packed;current.classList.remove('active');current=null;prompt.textContent='Press Listen';next()},900)});
prompt.textContent='Press Listen';
</script>
</body>
</html>
