<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 1 — Look and write • Super Minds 2</title>
<style>
:root{font-family:Arial,sans-serif;color:#243653;background:#eaf2fb;--blue:#3278c4;--green:#338b5d;--red:#d95b53}
*{box-sizing:border-box}body{margin:0}.page{max-width:1120px;margin:auto;padding:26px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.crumb{color:#35699f;text-decoration:none;font-weight:700}.unit{font-size:.95rem;color:#6c7e91}.sheet{background:#fff;border-radius:24px;padding:clamp(18px,3.4vw,34px);box-shadow:0 9px 28px #18345214}h1{text-align:center;color:#1f4f7e;font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.2;margin:0 0 10px}.instruction{text-align:center;margin:0 0 23px;color:#50647a;font-size:1.05rem;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{min-width:0;padding:15px 17px 13px;border:2px solid #d9e7f4;border-top:5px solid #f3c95a;border-radius:19px;background:linear-gradient(145deg,#fff 48%,#f5f9ff);box-shadow:0 4px 12px #25466b0c}.card:nth-child(4n+2){border-top-color:#8fc5a0}.card:nth-child(4n+3){border-top-color:#90b7e6}.card:nth-child(4n){border-top-color:#e7a7bd}.card.correct{border-color:#73bd87;background:#f4fbf4}.card.incorrect{border-color:#e99a91;background:#fff7f5}.picture{height:112px;display:flex;align-items:center;justify-content:center;gap:20px;background:#f5f9ff;border-radius:14px;margin-bottom:12px}.child{font-size:3.6rem;line-height:1}.food{font-size:3.5rem;line-height:1}.cue{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:1.25rem;line-height:1;background:#e8f6ec;box-shadow:0 2px 5px #18345218}.cue.dislike{background:#fff0ee}.sentence{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;color:#30445d;font-size:1.08rem;font-weight:700}.sentence-name{color:#1f4f7e;min-width:55px}.food-word{white-space:nowrap}.sentence .cue{width:28px;height:28px;font-size:1rem;flex:none}.answer{flex:1;min-width:155px;width:100%;height:45px;border:2px solid #b5cce2;border-radius:10px;padding:8px 11px;background:#fff;color:#243653;font:700 1rem Arial,sans-serif}.answer::placeholder{color:#8798a8}.answer:focus{outline:3px solid #c6e1fb;border-color:#4386c7}.feedback{min-height:1.35em;margin:8px 0 0;text-align:center;font-size:.94rem;font-weight:700}.feedback.correct{color:#208048}.feedback.incorrect{color:#ba4942}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 0}button{border:0;border-radius:13px;background:#3278c4;color:#fff;padding:12px 26px;font:700 1rem Arial,sans-serif;cursor:pointer}button:hover{background:#245f9d}button:focus-visible,.crumb:focus-visible,.back:focus-visible{outline:3px solid #f3c74e;outline-offset:3px}#reset{background:#f2b633;color:#3d341f}#reset:hover{background:#dda323}.score{text-align:center;font-size:1.18rem;font-weight:800;color:#264d74;margin:18px 0 0}.final{display:none;text-align:center;margin:15px auto 0;padding:16px;background:#f0f7ff;border-radius:16px}.final.show{display:block}.final-text{font-size:1.15rem;font-weight:800}.student-entry{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px auto 8px;font-weight:700}.student-entry.visible{display:flex}.student-entry input{min-width:210px;max-width:100%;padding:10px 12px;border:2px solid #bdcfe1;border-radius:10px;font:inherit;font-weight:400;color:#243653}.submit-results{display:none;margin:8px;background:#3278c4}.submit-results.visible{display:inline-block}.submit-results:disabled{opacity:.75;cursor:default}.submission-status{display:none;margin:10px auto 0;font-weight:700}.submission-status.visible{display:block}.submission-status.success{color:#208048}.submission-status.error{color:#ba4942}.back{display:block;width:max-content;margin:24px auto 0;background:#3278c4;color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:13px}
@media(max-width:680px){.page{padding:17px 11px 28px}.top{margin-bottom:12px}.sheet{padding:15px 11px 19px}.cards{grid-template-columns:1fr;gap:12px}.card{padding:13px 14px 11px}.sentence{font-size:1rem}.answer{min-width:130px}}
</style>
</head>
<body>
<main class="page">
<div class="top"><a class="crumb" href="index.html">← Writing</a><span class="unit">Super Minds 2 · Unit 2</span></div>
<section class="sheet" aria-labelledby="title">
  <h1 id="title">Look and write likes or doesn’t like.</h1>
  <p class="instruction">Look at each picture. Type <strong>likes</strong> or <strong>doesn’t like</strong>.</p>
  <div class="cards" id="cards">
    <article class="card" data-answer="likes"><div class="picture" role="img" aria-label="Tom, bananas and a smiling face"><span class="child" aria-hidden="true">👦🏻</span><span class="food" aria-hidden="true">🍌</span></div><p class="sentence"><span class="sentence-name">Tom</span><input class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Tom: type likes or doesn’t like" placeholder="__________"><span class="food-word">bananas.</span><span class="cue" aria-hidden="true">😊</span></p><p class="feedback" aria-live="polite"></p></article>
    <article class="card" data-answer="doesn't like"><div class="picture" role="img" aria-label="Ben, bananas and a sad face"><span class="child" aria-hidden="true">👦🏼</span><span class="food" aria-hidden="true">🍌</span></div><p class="sentence"><span class="sentence-name">Ben</span><input class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Ben: type likes or doesn’t like" placeholder="__________"><span class="food-word">bananas.</span><span class="cue dislike" aria-hidden="true">🙁</span></p><p class="feedback" aria-live="polite"></p></article>
    <article class="card" data-answer="likes"><div class="picture" role="img" aria-label="Anna, apples and a smiling face"><span class="child" aria-hidden="true">👧🏻</span><span class="food" aria-hidden="true">🍎</span></div><p class="sentence"><span class="sentence-name">Anna</span><input class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Anna: type likes or doesn’t like" placeholder="__________"><span class="food-word">apples.</span><span class="cue" aria-hidden="true">😊</span></p><p class="feedback" aria-live="polite"></p></article>
    <article class="card" data-answer="doesn't like"><div class="picture" role="img" aria-label="Grace, apples and a sad face"><span class="child" aria-hidden="true">👧🏼</span><span class="food" aria-hidden="true">🍎</span></div><p class="sentence"><span class="sentence-name">Grace</span><input class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Grace: type likes or doesn’t like" placeholder="__________"><span class="food-word">apples.</span><span class="cue dislike" aria-hidden="true">🙁</span></p><p class="feedback" aria-live="polite"></p></article>
    <article class="card" data-answer="likes"><div class="picture" role="img" aria-label="Jill, milk and a smiling face"><span class="child" aria-hidden="true">👧🏽</span><span class="food" aria-hidden="true">🥛</span></div><p class="sentence"><span class="sentence-name">Jill</span><input class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Jill: type likes or doesn’t like" placeholder="__________"><span class="food-word">milk.</span><span class="cue" aria-hidden="true">😊</span></p><p class="feedback" aria-live="polite"></p></article>
    <article class="card" data-answer="doesn't like"><div class="picture" role="img" aria-label="Bill, milk and a sad face"><span class="child" aria-hidden="true">👦🏽</span><span class="food" aria-hidden="true">🥛</span></div><p class="sentence"><span class="sentence-name">Bill</span><input class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Bill: type likes or doesn’t like" placeholder="__________"><span class="food-word">milk.</span><span class="cue dislike" aria-hidden="true">🙁</span></p><p class="feedback" aria-live="polite"></p></article>
  </div>
  <div class="actions"><button id="check" type="button">Check</button><button id="reset" type="button">Try again / Reset</button></div>
  <p class="score" aria-live="polite">Score: <span id="score">0</span> / 6</p>
  <div class="final" id="final" aria-live="polite"><span class="final-text" id="finalText"></span><div class="student-entry" id="studentEntry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name" disabled></div><button class="submit-results" id="submitResults" type="button" disabled>Submit results</button><div class="submission-status" id="submissionStatus" aria-live="polite"></div></div>
</section>
<a class="back" href="index.html">← Back to Writing</a>
</main>
<script>
const cards=[...document.querySelectorAll('.card[data-answer]')];
const score=document.getElementById('score'),final=document.getElementById('final'),finalText=document.getElementById('finalText'),studentEntry=document.getElementById('studentEntry'),studentName=document.getElementById('studentName'),submitButton=document.getElementById('submitResults'),submissionStatus=document.getElementById('submissionStatus');
const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
let submissionInProgress=false,submittedPayload=null;
function normalize(value){return value.trim().toLocaleLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function checkAnswers(){let total=0;cards.forEach(card=>{const input=card.querySelector('.answer'),correct=normalize(input.value)===card.dataset.answer;card.classList.toggle('correct',correct);card.classList.toggle('incorrect',!correct);const feedback=card.querySelector('.feedback');feedback.className='feedback '+(correct?'correct':'incorrect');feedback.textContent=correct?'✓ Correct':'✗ Try again';if(correct)total++});score.textContent=String(total);finalText.textContent='Your score: '+total+' / 6';final.classList.add('show');studentEntry.classList.add('visible');studentName.disabled=false;submitButton.classList.add('visible');submitButton.disabled=false}
function reset(){cards.forEach(card=>{card.querySelector('.answer').value='';card.classList.remove('correct','incorrect');const feedback=card.querySelector('.feedback');feedback.textContent='';feedback.className='feedback'});score.textContent='0';finalText.textContent='';final.classList.remove('show');studentEntry.classList.remove('visible');studentName.value='';studentName.disabled=true;submitButton.classList.remove('visible');submitButton.disabled=true;submitButton.textContent='Submit results';submissionStatus.textContent='';submissionStatus.className='submission-status'}
document.getElementById('check').addEventListener('click',checkAnswers);document.getElementById('reset').addEventListener('click',reset);
submitButton.addEventListener('click',async()=>{if(submissionInProgress||submitButton.disabled)return;const name=studentName.value.trim();if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status visible error';return}const answers=cards.map((card,index)=>(index+1)+': '+card.querySelector('.sentence-name').textContent+' '+(card.querySelector('.answer').value.trim()||'(blank)')).join('; '),payload=new URLSearchParams({student:name,unit:'Unit 2',section:'Writing',exercise:'Exercise 1',answers,score:score.textContent+'/6'}).toString();if(payload===submittedPayload){submitButton.textContent='✓ Results submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status visible success';return}submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed');submittedPayload=payload;submitButton.textContent='✓ Results submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status visible success'}catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status visible error';submitButton.disabled=false}finally{submissionInProgress=false}});
</script>
</body>
</html>
