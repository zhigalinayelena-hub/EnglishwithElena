<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 3 — Complete the sentences • Super Minds 2</title>
<style>
:root{font-family:Arial,sans-serif;color:#243653;background:#eaf2fb;--blue:#3278c4;--green:#338b5d;--red:#d95b53}
*{box-sizing:border-box}body{margin:0}.page{max-width:1120px;margin:auto;padding:26px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.crumb{color:#35699f;text-decoration:none;font-weight:700}.unit{font-size:.95rem;color:#6c7e91}.sheet{background:#fff;border-radius:24px;padding:clamp(18px,3.4vw,34px);box-shadow:0 9px 28px #18345214}h1{text-align:center;color:#1f4f7e;font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.2;margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{min-width:0;padding:15px 17px 13px;border:2px solid #d9e7f4;border-top:5px solid #f3c95a;border-radius:19px;background:linear-gradient(145deg,#fff 48%,#f5f9ff);box-shadow:0 4px 12px #25466b0c}.card:nth-child(4n+2){border-top-color:#8fc5a0}.card:nth-child(4n+3){border-top-color:#90b7e6}.card:nth-child(4n){border-top-color:#e7a7bd}.card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.number{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:#f6d36e;color:#684e13;font-weight:800;font-size:1.05rem}.name{margin:0;color:#264c73;font-size:1.25rem}.picture{height:120px;display:flex;align-items:center;justify-content:center;gap:25px;position:relative;margin:0 0 10px;border-radius:15px;background:#eef7ff}.food{font-size:clamp(3.5rem,6vw,4.5rem);line-height:1;filter:drop-shadow(0 3px 1px #24365318)}.reaction{width:55px;height:55px;display:grid;place-items:center;border-radius:50%;font-size:2.15rem;background:#fff;box-shadow:0 2px 7px #233c5b20}.likes .reaction{border:2px solid #b7dfc3}.dislikes .reaction{border:2px solid #f2c2bd}.prompt{margin:0 0 7px;color:#61758a;font-size:.92rem;font-weight:700}.answer{display:block;width:100%;min-height:55px;resize:vertical;border:2px solid #b5cce2;border-radius:11px;padding:10px 12px;background:#fff;color:#243653;font:600 1rem/1.35 Arial,sans-serif}.answer::placeholder{font-size:.92rem;font-weight:400;color:#788b9c;opacity:1}.answer:focus{outline:3px solid #c6e1fb;border-color:#4386c7}.card.correct{border-color:#73bd87;background:#f4fbf4}.card.incorrect{border-color:#e99a91;background:#fff7f5}.feedback{min-height:1.35em;margin:6px 0 0;text-align:center;font-size:.94rem;font-weight:700}.feedback.correct{color:#208048}.feedback.incorrect{color:#ba4942}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 0}button{border:0;border-radius:13px;background:#3278c4;color:#fff;padding:12px 26px;font:700 1rem Arial,sans-serif;cursor:pointer}button:hover{background:#245f9d}button:focus-visible,.crumb:focus-visible{outline:3px solid #f3c74e;outline-offset:3px}#reset{background:#f2b633;color:#3d341f}#reset:hover{background:#dda323}.score{text-align:center;font-size:1.18rem;font-weight:800;color:#264d74;margin:18px 0 0}.final{display:none;text-align:center;margin:15px auto 0;padding:16px;background:#f0f7ff;border-radius:16px}.final.show{display:block}.final-text{font-size:1.15rem;font-weight:800}.student-entry{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px auto 8px;font-weight:700}.student-entry.visible{display:flex}.student-entry input{min-width:210px;max-width:100%;padding:10px 12px;border:2px solid #bdcfe1;border-radius:10px;font:inherit;font-weight:400;color:#243653}.submit-results{display:none;margin:8px;background:#3278c4}.submit-results.visible{display:inline-block}.submit-results:disabled{opacity:.75;cursor:default}.submission-status{display:none;margin:10px auto 0;font-weight:700}.submission-status.visible{display:block}.submission-status.success{color:#208048}.submission-status.error{color:#ba4942}.back{display:block;width:max-content;margin:24px auto 0;background:#3278c4;color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:13px}
@media(max-width:680px){.page{padding:17px 11px 28px}.top{margin-bottom:12px}.sheet{padding:15px 11px 19px}.cards{grid-template-columns:1fr;gap:12px}.card{padding:13px 14px 11px}.picture{height:105px}.answer{min-height:48px}}
.instruction{text-align:center;margin:-12px 0 22px;color:#50647a;font-size:1.05rem;font-weight:700}.sentence{display:flex;align-items:center;gap:7px;margin:0;color:#2e4057;font-size:1.16rem;font-weight:800}.sentence-name{flex:none;color:#264c73}.answer{flex:1;min-width:0;width:100%;height:49px;min-height:49px;resize:none;padding:9px 10px;font:600 1rem Arial,sans-serif}.answer::placeholder{color:#8191a1;font-size:.9rem}.period{flex:none}
</style>
</head>
<body>
<main class="page">
<div class="top"><a class="crumb" href="index.html">← Writing</a><span class="unit">Super Minds 2 · Unit 2</span></div>
<section class="sheet" aria-labelledby="title"><h1 id="title">Complete the sentences.</h1><p class="instruction">Complete each sentence. Type the missing words.</p>
<div class="cards" id="cards">
<article class="card dislikes" data-answer="doesn't like carrots" data-alternative="does not like carrots"><div class="card-head"><span class="number">1</span></div><div class="picture" role="img" aria-label="Several carrots and an unhappy face"><span class="food" aria-hidden="true">🥕🥕</span><span class="reaction" aria-hidden="true">🙁</span></div><p class="sentence"><span class="sentence-name">Emma</span><input class="answer" id="answer1" type="text" aria-label="Words to complete: Emma blank" autocomplete="off"><span class="period">.</span></p><p class="feedback" aria-live="polite"></p></article>
<article class="card likes" data-answer="likes cake"><div class="card-head"><span class="number">2</span></div><div class="picture" role="img" aria-label="Cake and a happy face"><span class="food" aria-hidden="true">🍰</span><span class="reaction" aria-hidden="true">🙂</span></div><p class="sentence"><span class="sentence-name">Mark</span><input class="answer" id="answer2" type="text" aria-label="Words to complete: Mark blank" autocomplete="off"><span class="period">.</span></p><p class="feedback" aria-live="polite"></p></article>
<article class="card dislikes" data-answer="doesn't like peas" data-alternative="does not like peas"><div class="card-head"><span class="number">3</span></div><div class="picture" role="img" aria-label="Peas and an unhappy face"><span class="food" aria-hidden="true">🫛</span><span class="reaction" aria-hidden="true">🙁</span></div><p class="sentence"><span class="sentence-name">Suzy</span><input class="answer" id="answer3" type="text" aria-label="Words to complete: Suzy blank" autocomplete="off"><span class="period">.</span></p><p class="feedback" aria-live="polite"></p></article>
<article class="card likes" data-answer="likes sausages"><div class="card-head"><span class="number">4</span></div><div class="picture" role="img" aria-label="Several separate sausages on a plate and a happy face"><svg class="food" aria-hidden="true" width="150" height="92" viewBox="0 0 180 110" xmlns="http://www.w3.org/2000/svg"><ellipse cx="88" cy="78" rx="78" ry="24" fill="#fff" stroke="#b8cde1" stroke-width="5"/><ellipse cx="88" cy="77" rx="62" ry="15" fill="#edf5fc" stroke="#d3e1ee" stroke-width="3"/><g fill="none" stroke-linecap="round" stroke-width="16"><path d="M38 61 108 38" stroke="#a84427"/><path d="M49 80 130 55" stroke="#bd5931"/><path d="M75 87 145 69" stroke="#a84427"/><path d="M30 47 82 31" stroke="#bd5931"/></g><g fill="none" stroke-linecap="round" stroke-width="3"><path d="m48 57 6-2m38-13 6-2M60 75l6-2m40-13 6-2m-21 26 6-2m37-12 6-2M37 44l6-2m24-7 6-2" stroke="#e99a61"/></g></svg><span class="reaction" aria-hidden="true">🙂</span></div><p class="sentence"><span class="sentence-name">Dan</span><input class="answer" id="answer4" type="text" aria-label="Words to complete: Dan blank" autocomplete="off"><span class="period">.</span></p><p class="feedback" aria-live="polite"></p></article>
<article class="card likes" data-answer="likes apples"><div class="card-head"><span class="number">5</span></div><div class="picture" role="img" aria-label="Two apples and a happy face"><span class="food" aria-hidden="true">🍎🍎</span><span class="reaction" aria-hidden="true">🙂</span></div><p class="sentence"><span class="sentence-name">Pam</span><input class="answer" id="answer5" type="text" aria-label="Words to complete: Pam blank" autocomplete="off"><span class="period">.</span></p><p class="feedback" aria-live="polite"></p></article>
<article class="card dislikes" data-answer="doesn't like chicken" data-alternative="does not like chicken"><div class="card-head"><span class="number">6</span></div><div class="picture" role="img" aria-label="Chicken and an unhappy face"><span class="food" aria-hidden="true">🍗</span><span class="reaction" aria-hidden="true">🙁</span></div><p class="sentence"><span class="sentence-name">Toby</span><input class="answer" id="answer6" type="text" aria-label="Words to complete: Toby blank" autocomplete="off"><span class="period">.</span></p><p class="feedback" aria-live="polite"></p></article>
</div>
<div class="actions"><button id="check" type="button">Check</button><button id="reset" type="button">Try again / Reset</button></div>
<p class="score" aria-live="polite">Score: <span id="score">0</span> / 6</p>
<div class="final" id="final" aria-live="polite"><span class="final-text" id="finalText"></span><div class="student-entry" id="studentEntry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name" disabled></div><button class="submit-results" id="submitResults" type="button" disabled>Submit results</button><div class="submission-status" id="submissionStatus" aria-live="polite"></div></div>
</section><a class="back" href="index.html">← Back to Writing</a>
</main>
<script>
const cards=[...document.querySelectorAll('.card[data-answer]')],score=document.getElementById('score'),final=document.getElementById('final'),finalText=document.getElementById('finalText'),studentEntry=document.getElementById('studentEntry'),studentName=document.getElementById('studentName'),submitButton=document.getElementById('submitResults'),submissionStatus=document.getElementById('submissionStatus');
const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';let submissionInProgress=false,submittedPayload=null;
function normalized(value){return value.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function checkAnswers(){let total=0;cards.forEach(card=>{const input=card.querySelector('.answer'),feedback=card.querySelector('.feedback'),answer=normalized(input.value),accepted=[card.dataset.answer,card.dataset.alternative].filter(Boolean).map(normalized),correct=accepted.includes(answer);card.classList.toggle('correct',correct);card.classList.toggle('incorrect',!correct);feedback.className='feedback '+(correct?'correct':'incorrect');feedback.textContent=correct?'✓ Correct':'✗ Try again';if(correct)total++});score.textContent=String(total);finalText.textContent='Your score: '+total+' / 6';final.classList.add('show');studentEntry.classList.add('visible');studentName.disabled=false;submitButton.classList.add('visible');submitButton.disabled=false}
document.getElementById('check').addEventListener('click',checkAnswers);
document.getElementById('reset').addEventListener('click',()=>{cards.forEach(card=>{card.querySelector('.answer').value='';card.classList.remove('correct','incorrect');const feedback=card.querySelector('.feedback');feedback.textContent='';feedback.className='feedback'});score.textContent='0';final.classList.remove('show');finalText.textContent='';studentEntry.classList.remove('visible');studentName.disabled=true;submitButton.classList.remove('visible');submitButton.disabled=true;submitButton.textContent='Submit results';submissionStatus.textContent='';submissionStatus.className='submission-status'});
submitButton.addEventListener('click',async()=>{if(submissionInProgress||submitButton.disabled)return;const name=studentName.value.trim();if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status visible error';return}const answers=cards.map((card,index)=>(index+1)+': '+card.querySelector('.sentence-name').textContent+' '+(card.querySelector('.answer').value.trim()||'(blank)')+'.').join('; '),payload=new URLSearchParams({student:name,unit:'Unit 2',section:'Writing',exercise:'Exercise 3',answers,score:score.textContent+'/6'}).toString();if(payload===submittedPayload){submitButton.textContent='✓ Results submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status visible success';return}submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed with status '+response.status);submittedPayload=payload;submitButton.textContent='✓ Results submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status visible success'}catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status visible error';submitButton.disabled=false}finally{submissionInProgress=false}});
</script>
</body>
</html>
