<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 1 • Word order • Super Minds 2</title>
<style>
*{box-sizing:border-box}
:root{font-family:Arial,sans-serif;color:#263b50;background:#f4f8e9;--green:#4d8b45;--deep:#356c3b;--gold:#f1c84c;--blue:#397db5}
body{margin:0}.page{max-width:1000px;margin:auto;padding:26px 22px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.crumb{color:#52714e;text-decoration:none;font-weight:700}.unit{font-size:.95rem;color:#75816d}
.sheet{background:#fff;border:3px solid #d9e8c8;border-radius:22px;padding:clamp(18px,4vw,38px);box-shadow:0 8px 22px #38542c18}.heading{text-align:center;margin:0 0 8px;color:#2f6538;font-size:clamp(1.8rem,4vw,2.4rem)}.instruction{text-align:center;font-size:1.2rem;font-weight:700;margin:0 0 25px;color:#4d5860}
.items{display:grid;gap:14px}.item{display:grid;grid-template-columns:42px minmax(190px,.85fr) minmax(200px,1.15fr);gap:14px;align-items:center;padding:15px;border-radius:16px;background:#f7faef;border:2px solid #e3ebd9}.number{background:#e3f0d8;color:#346a37;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.05rem}.scramble{font-size:1.05rem;font-weight:700;color:#455d43;line-height:1.5}.answer-wrap{min-width:0}.answer-wrap label{display:block;font-weight:700;margin-bottom:6px}.answer-wrap input{display:block;width:100%;min-width:0;height:48px;font:600 1.03rem Arial,sans-serif;color:#263b50;border:2px solid #b9cda9;border-radius:11px;padding:10px 12px;background:#fff}.answer-wrap input:focus{outline:3px solid #d2eab8;border-color:#6f9c4c}.item.correct{border-color:#4d9b57;background:#eff9ed}.item.incorrect{border-color:#dc7770;background:#fff1ef}.feedback{grid-column:2/-1;min-height:0;font-size:.92rem;font-weight:700}.item.correct .feedback{color:#28743b}.item.incorrect .feedback{color:#b23c34}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 8px}button{font:700 1rem Arial;cursor:pointer;border:0;border-radius:12px;padding:12px 25px}#check{background:#4d8b45;color:#fff;box-shadow:0 3px 0 #356c3b}#try-again{background:#edf1e8;color:#395340;border:1px solid #d3dfcc}.score{display:none;text-align:center;font-size:1.2rem;font-weight:700;color:#356c3b;margin:16px 0 0}.score.visible{display:block}.final{display:none;text-align:center;background:#f0f7e9;border-radius:15px;padding:18px;margin-top:20px}.final.show{display:block}.final-text{display:block;font-size:1.25rem;font-weight:700;margin-bottom:10px}.student-entry{display:none;margin:10px auto;max-width:360px;text-align:left}.student-entry.visible{display:block}.student-entry label{display:block;font-weight:700;margin-bottom:6px}.student-entry input{width:100%;padding:10px;border:2px solid #cad7c1;border-radius:9px;font:inherit}.submit-results{display:none;background:#397db5;color:#fff}.submit-results.visible{display:inline-block}.submission-status{min-height:1.4em;font-weight:700;margin-top:10px}.submission-status.success{color:#28743b}.submission-status.error{color:#b23c34}.back{display:block;width:max-content;margin:24px auto 0;background:#397db5;color:#fff;padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:700}
@media(max-width:700px){.page{padding:16px 12px 28px}.item{grid-template-columns:38px 1fr;gap:10px}.answer-wrap{grid-column:2}.feedback{grid-column:2}.top{margin-bottom:12px}}
</style>
</head>
<body>
<main class="page">
<div class="top"><a class="crumb" href="index.html">← Grammar</a><span class="unit">Super Minds 2 · Unit 3</span></div>
<section class="sheet" aria-label="Word order exercise">
<h1 class="heading">Exercise 1</h1>
<p class="instruction">Write the words in the correct order.</p>
<div class="items" id="items">
<div class="item" data-answer="The fish is next to the rock."><span class="number">1</span><div class="scramble">is / The fish / the rock / next to</div><div class="answer-wrap"><label for="answer1">Write the sentence</label><input id="answer1" type="text" autocomplete="off" aria-label="Sentence 1"></div><div class="feedback" aria-live="polite"></div></div>
<div class="item" data-answer="The fish is in front of the rock."><span class="number">2</span><div class="scramble">in front of / is / the rock / The fish</div><div class="answer-wrap"><label for="answer2">Write the sentence</label><input id="answer2" type="text" autocomplete="off" aria-label="Sentence 2"></div><div class="feedback" aria-live="polite"></div></div>
<div class="item" data-answer="The fish is behind the rock."><span class="number">3</span><div class="scramble">behind / is / The fish / the rock</div><div class="answer-wrap"><label for="answer3">Write the sentence</label><input id="answer3" type="text" autocomplete="off" aria-label="Sentence 3"></div><div class="feedback" aria-live="polite"></div></div>
<div class="item" data-answer="The rock is between the tree and the fish."><span class="number">4</span><div class="scramble">the tree / is between / and / the fish / The rock</div><div class="answer-wrap"><label for="answer4">Write the sentence</label><input id="answer4" type="text" autocomplete="off" aria-label="Sentence 4"></div><div class="feedback" aria-live="polite"></div></div>
</div>
<div class="actions"><button id="check" type="button">Check Answers</button><button id="try-again" type="button">Try Again</button></div>
<p class="score" aria-live="polite">Score: <span id="score">0</span> / 4</p>
<div class="final" id="final" aria-live="polite"><span class="final-text" id="finalText"></span><div class="student-entry" id="studentEntry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name" disabled></div><button class="submit-results" id="submitResults" type="button" disabled>Submit Results</button><div class="submission-status" id="submissionStatus" aria-live="polite"></div></div>
</section>
<a class="back" href="index.html">← Back to Grammar</a>
</main>
<script>
const items=[...document.querySelectorAll('.item')];
const score=document.getElementById('score'),final=document.getElementById('final'),finalText=document.getElementById('finalText');
const studentName=document.getElementById('studentName'),studentEntry=document.getElementById('studentEntry');
const submitButton=document.getElementById('submitResults'),submissionStatus=document.getElementById('submissionStatus');
const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
let submissionInProgress=false,submittedPayload=null,hasSubmitted=false;
function normalize(value){return value.trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'').toLowerCase()}
function clearResults(){items.forEach(item=>{item.classList.remove('correct','incorrect');item.querySelector('.feedback').textContent=''});score.textContent='0';score.parentElement.classList.remove('visible');final.classList.remove('show');finalText.textContent='';studentEntry.classList.remove('visible');studentName.disabled=true;submitButton.classList.remove('visible');submitButton.disabled=true;submitButton.textContent='Submit Results';submissionStatus.textContent='';submissionStatus.className='submission-status'}
document.getElementById('check').addEventListener('click',()=>{let total=0;items.forEach(item=>{const input=item.querySelector('input'),actual=normalize(input.value),expected=normalize(item.dataset.answer),feedback=item.querySelector('.feedback');item.classList.remove('correct','incorrect');if(actual===expected){total++;item.classList.add('correct');feedback.textContent='✓ Correct!'}else{item.classList.add('incorrect');feedback.textContent=input.value.trim()?'✗ Correct answer: '+item.dataset.answer:'✗ Please write a sentence. Correct answer: '+item.dataset.answer}});score.textContent=total;score.parentElement.classList.add('visible');finalText.textContent='Your score: '+total+' / 4';final.classList.add('show');studentEntry.classList.add('visible');studentName.disabled=false;submitButton.classList.add('visible');submitButton.disabled=hasSubmitted;if(hasSubmitted)submitButton.textContent='✓ Results submitted'});
document.getElementById('try-again').addEventListener('click',()=>{items.forEach(item=>{item.querySelector('input').value=''});hasSubmitted=false;clearResults()});
submitButton.addEventListener('click',async()=>{if(submissionInProgress||submitButton.disabled)return;const name=studentName.value.trim();if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status visible error';return}const answers=items.map((item,index)=>(index+1)+': '+(item.querySelector('input').value.trim()||'(blank)')).join('; ');const data=new URLSearchParams({student:name,unit:'Unit 3',section:'Grammar',exercise:'Exercise 1',answers,score:score.textContent+'/4'}),payload=data.toString();if(payload===submittedPayload){hasSubmitted=true;submitButton.textContent='✓ Results submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status visible success';return}submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed');submittedPayload=payload;hasSubmitted=true;submitButton.textContent='✓ Results submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status visible success'}catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status visible error';submitButton.disabled=false}finally{submissionInProgress=false}});
</script>
</body>
</html>
