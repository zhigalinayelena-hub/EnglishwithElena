
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People in the Arts</title>
<style>
body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:30px;
}
h1{
text-align:center;
color:#1f3552;
}
p{
text-align:center;
color:#556;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
margin-top:25px;
}
.card{
background:white;
border-radius:18px;
padding:18px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,.08);
transition:.2s;
}
.card:hover{
transform:translateY(-4px);
}
.emoji{
font-size:42px;
}
.word{
font-size:24px;
font-weight:bold;
margin:10px 0;
color:#20344d;
}
.sentence{
color:#4b5563;
min-height:42px;
font-size:15px;
}
.done{
background:#d8f5dc;
}
button{
display:block;
margin:28px auto 0;
padding:12px 22px;
font-size:16px;
background:#3b82f6;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}
.progress{
text-align:center;
margin-top:18px;
font-weight:bold;
color:#2563eb;
}
</style>
</head>
<body>

<h1>People in the Arts</h1>
<p>Click a card. Listen, read and repeat!</p>

<div class="grid" id="grid"></div>

<div class="progress" id="progress">0 / 10 learned</div>

<button onclick="shuffleCards()">🔀 Shuffle cards</button>

<script>
const words=[
["🎭","actor","I am an actor."],
["🎨","artist","I am an artist."],
["💃","dancer","I am a dancer."],
["🎬","director","I am a director."],
["🎸","guitarist","I am a guitarist."],
["🎵","musician","I am a musician."],
["🖌️","painter","I am a painter."],
["📷","photographer","I am a photographer."],
["📝","poet","I am a poet."],
["✍️","writer","I am a writer."]
];

let learned=new Set();

function speak(text){
const u=new SpeechSynthesisUtterance(text);
u.lang="en-GB";
speechSynthesis.cancel();
speechSynthesis.speak(u);
}

function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";
words.forEach((w,i)=>{
const card=document.createElement("div");
card.className="card"+(learned.has(i)?" done":"");
card.innerHTML=`
<div class="emoji">${w[0]}</div>
<div class="word">${w[1]}</div>
<div class="sentence">${learned.has(i)?w[2]:"Click to listen"}</div>`;
card.onclick=()=>{
speak(w[1]);
setTimeout(()=>speak(w[2]),800);
learned.add(i);
update();
render();
};
grid.appendChild(card);
});
}

function update(){
document.getElementById("progress").textContent=
`${learned.size} / ${words.length} learned`;
}

function shuffleCards(){
for(let i=words.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[words[i],words[j]]=[words[j],words[i]];
}
render();
}

render();
update();
</script>

</body>
</html>
