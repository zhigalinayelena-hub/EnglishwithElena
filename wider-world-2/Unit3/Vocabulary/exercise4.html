<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 4 — Wider World 2 Unit 3 Vocabulary</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}
*{box-sizing:border-box}body{margin:0}.container{max-width:1050px;margin:auto;padding:30px 22px 46px}
.label{text-align:center;color:#2869d8;font-size:.92rem;font-weight:bold;letter-spacing:.14em;margin:0 0 9px}h1{text-align:center;font-size:clamp(1.8rem,4vw,2.7rem);margin:0 0 8px}.subtitle{text-align:center;color:#5f6d7a;font-size:1.15rem;margin:0 0 25px}
.questions{display:grid;gap:14px}.question{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:start;gap:11px;background:#fff;border:3px solid transparent;border-radius:17px;padding:17px 19px;box-shadow:0 7px 18px rgba(0,0,0,.07);transition:border-color .15s,background .15s}.number{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#e6f1ff;color:#2869d8;font-weight:bold;font-size:1.05rem}.content{min-width:0}.sentence{font-size:1.08rem;line-height:1.8;font-weight:bold;margin:2px 0}.pair{display:inline-flex;align-items:center;gap:4px;white-space:normal}.option{border:2px solid #b9d5f3;background:#edf6ff;color:#1f3552;border-radius:11px;padding:5px 10px;font:inherit;font-weight:bold;cursor:pointer;transition:background .15s,border-color .15s,color .15s}.option:hover{background:#dceeff}.option[aria-pressed="true"]{background:#2869d8;border-color:#2869d8;color:#fff}.question.correct{border-color:#70c994;background:#f6fff8}.question.incorrect{border-color:#ee8e8e;background:#fff9f9}.question.correct .number{background:#dff8e8;color:#168344}.question.incorrect .number{background:#ffe7e7;color:#c33333}.question .option.is-correct{border-color:#229a58;background:#eafff1;color:#167a42}.question .option.is-wrong{border-color:#d74a4a;background:#fff0f0;color:#b32626}.result{font-size:.94rem;font-weight:bold;min-height:21px;margin-top:10px}.question.correct .result{color:#168344}.question.incorrect .result{color:#c33333}.example{background:#f7fbff}.example .number{background:#dff8e8;color:#168344}.example-option{display:inline-block;border:2px solid #cf5858;border-radius:999px;padding:3px 10px;color:#1f3552;margin:0 2px}
.student-entry{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 0;font-weight:bold}.student-entry.visible{display:flex}.student-entry input{font:inherit;font-weight:normal;padding:10px 12px;border:2px solid #d9e5f1;border-radius:10px;min-width:220px}.submit-results{display:none;margin-top:12px}.submit-results.visible{display:inline-block}.submit-results:disabled{opacity:.75;cursor:default}.submission-status{text-align:center;min-height:24px;margin:8px 0 0;font-weight:bold}.submission-status.good{color:#168344}.submission-status.try{color:#c33333}
.option:focus-visible,.button:focus-visible,a:focus-visible,.student-entry input:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.button{border:0;border-radius:12px;background:#2869d8;color:#fff;padding:13px 24px;font-weight:bold;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}.button:hover{background:#1e56b5}.button.secondary{background:#fff;color:#2869d8;border:2px solid #2869d8}.score{background:#fff;border-radius:12px;padding:12px 18px;font-size:1.05rem;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.07)}.feedback{text-align:center;min-height:27px;margin-top:14px;font-size:1.08rem;font-weight:bold}.feedback.good{color:#168344}.feedback.try{color:#c33333}.back{display:inline-block;margin-top:17px;color:#2869d8;text-decoration:none;font-weight:bold}.back:hover{text-decoration:underline}
@media(max-width:650px){.container{padding:24px 13px 35px}.question{grid-template-columns:32px minmax(0,1fr);gap:8px;padding:13px 11px}.number{width:30px;height:30px}.sentence{font-size:1rem;line-height:1.8}.pair{white-space:normal}.option{padding:5px 7px;font-size:.94rem}.student-entry input{min-width:0;flex:1}}
</style>
</head>
<body>
<main class="container">
  <p class="label">UNIT 3 · VOCABULARY</p>
  <h1>Exercise 4</h1>
  <p class="subtitle">Choose the correct option.</p>
  <section class="questions" aria-label="Choose the correct option">
    <article class="question example" aria-label="Completed example"><span class="number">1</span><div class="content"><p class="sentence">A bee <span>swims</span> / <span class="example-option">flies</span> and has <span class="example-option">wings</span> / <span>claws</span>.</p></div></article>
    <article class="question" data-answer-one="swims" data-answer-two="feathers"><span class="number">2</span><div class="content"><p class="sentence">A duck <span class="pair"><button class="option" type="button" data-pair="one" aria-pressed="false">climbs</button> / <button class="option" type="button" data-pair="one" aria-pressed="false">swims</button></span> and has <span class="pair"><button class="option" type="button" data-pair="two" aria-pressed="false">claws</button> / <button class="option" type="button" data-pair="two" aria-pressed="false">feathers</button></span>.</p><div class="result" aria-live="polite"></div></div></article>
    <article class="question" data-answer-one="climbs" data-answer-two="a tail"><span class="number">3</span><div class="content"><p class="sentence">A cat <span class="pair"><button class="option" type="button" data-pair="one" aria-pressed="false">climbs</button> / <button class="option" type="button" data-pair="one" aria-pressed="false">flies</button></span> and has <span class="pair"><button class="option" type="button" data-pair="two" aria-pressed="false">feathers</button> / <button class="option" type="button" data-pair="two" aria-pressed="false">a tail</button></span>.</p><div class="result" aria-live="polite"></div></div></article>
    <article class="question" data-answer-one="meat" data-answer-two="claws"><span class="number">4</span><div class="content"><p class="sentence">A tiger eats <span class="pair"><button class="option" type="button" data-pair="one" aria-pressed="false">vegetables</button> / <button class="option" type="button" data-pair="one" aria-pressed="false">meat</button></span> and has long <span class="pair"><button class="option" type="button" data-pair="two" aria-pressed="false">wings</button> / <button class="option" type="button" data-pair="two" aria-pressed="false">claws</button></span>.</p><div class="result" aria-live="polite"></div></div></article>
    <article class="question" data-answer-one="jumps" data-answer-two="fur"><span class="number">5</span><div class="content"><p class="sentence">A rabbit <span class="pair"><button class="option" type="button" data-pair="one" aria-pressed="false">jumps</button> / <button class="option" type="button" data-pair="one" aria-pressed="false">swims</button></span> and has <span class="pair"><button class="option" type="button" data-pair="two" aria-pressed="false">feathers</button> / <button class="option" type="button" data-pair="two" aria-pressed="false">fur</button></span>.</p><div class="result" aria-live="polite"></div></div></article>
    <article class="question" data-answer-one="bites" data-answer-two="teeth"><span class="number">6</span><div class="content"><p class="sentence">A shark <span class="pair"><button class="option" type="button" data-pair="one" aria-pressed="false">walks</button> / <button class="option" type="button" data-pair="one" aria-pressed="false">bites</button></span> and has sharp <span class="pair"><button class="option" type="button" data-pair="two" aria-pressed="false">claws</button> / <button class="option" type="button" data-pair="two" aria-pressed="false">teeth</button></span>.</p><div class="result" aria-live="polite"></div></div></article>
  </section>
  <div class="controls"><button class="button" id="checkButton" type="button">Check Answers</button><button class="button secondary" id="retryButton" type="button">Try Again</button><div class="score" id="score" aria-live="polite">Score: 0/10</div></div>
  <div class="student-entry" id="studentEntry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name"></div>
  <div class="controls"><button class="button submit-results" id="submitButton" type="button">Submit Results</button></div>
  <div class="feedback" id="feedback" aria-live="polite"></div><div class="submission-status" id="submissionStatus" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Vocabulary</a>
</main>
<script>
(() => {
  const questions=[...document.querySelectorAll('.question:not(.example)')];
  const score=document.getElementById('score'),feedback=document.getElementById('feedback');
  const studentEntry=document.getElementById('studentEntry'),studentName=document.getElementById('studentName');
  const submitButton=document.getElementById('submitButton'),submissionStatus=document.getElementById('submissionStatus');
  const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
  let checked=false,submissionInProgress=false,submittedPayload=null;
  questions.forEach(question=>question.querySelectorAll('.option').forEach(option=>option.addEventListener('click',()=>{
    if(checked)return;
    question.querySelectorAll(`.option[data-pair="${option.dataset.pair}"]`).forEach(button=>button.setAttribute('aria-pressed','false'));
    option.setAttribute('aria-pressed','true');
  })));
  function check(){
    checked=true;let points=0;
    questions.forEach(question=>{
      let questionPoints=0;const correctAnswers=[];
      for(const pair of ['one','two']){
        const correctAnswer=question.dataset[`answer${pair==='one'?'One':'Two'}`];
        correctAnswers.push(correctAnswer);
        const options=[...question.querySelectorAll(`.option[data-pair="${pair}"]`)];
        options.forEach(option=>{
          const isCorrect=option.textContent.trim()===correctAnswer;
          const isSelected=option.getAttribute('aria-pressed')==='true';
          if(isCorrect){option.classList.add('is-correct');if(isSelected)questionPoints++;}
          else if(isSelected)option.classList.add('is-wrong');
        });
      }
      points+=questionPoints;
      question.classList.add(questionPoints===2?'correct':'incorrect');
      question.querySelector('.result').textContent=questionPoints===2?'✓ Correct!':`${questionPoints}/2 correct. Correct answers: ${correctAnswers.join(', ')}.`;
    });
    score.textContent=`Score: ${points}/10`;
    feedback.textContent=points===10?'Excellent work! All answers are correct.':'Check the feedback for each sentence and try again.';
    feedback.className=`feedback ${points===10?'good':'try'}`;
    studentEntry.classList.add('visible');submitButton.classList.add('visible');submitButton.disabled=false;submitButton.textContent='Submit Results';
  }
  function reset(){
    checked=false;
    questions.forEach(question=>{question.querySelectorAll('.option').forEach(option=>{option.setAttribute('aria-pressed','false');option.classList.remove('is-correct','is-wrong');});question.querySelector('.result').textContent='';question.classList.remove('correct','incorrect');});
    score.textContent='Score: 0/10';feedback.textContent='';feedback.className='feedback';studentEntry.classList.remove('visible');submitButton.classList.remove('visible');submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';submissionStatus.className='submission-status';submittedPayload=null;
  }
  document.getElementById('checkButton').addEventListener('click',check);
  document.getElementById('retryButton').addEventListener('click',reset);
  submitButton.addEventListener('click',async()=>{
    if(submissionInProgress||submitButton.disabled)return;
    const name=studentName.value.trim();
    if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status try';return;}
    const answers=questions.map((question,index)=>{const one=question.querySelector('.option[data-pair="one"][aria-pressed="true"]');const two=question.querySelector('.option[data-pair="two"][aria-pressed="true"]');return `${index+2}: ${one?one.textContent.trim():'No answer'}, ${two?two.textContent.trim():'No answer'}`;});
    answers.unshift('1: flies, wings (example)');
    const payload=new URLSearchParams({student:name,unit:'Unit 3',section:'Vocabulary',exercise:'Exercise 4',answers:answers.join('; '),score:score.textContent.replace(/^Score:\s*/,'')}).toString();
    if(payload===submittedPayload){submitButton.textContent='✓ Results Submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status good';return;}
    submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';
    try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed');submittedPayload=payload;submitButton.textContent='✓ Results Submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status good';}
    catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status try';submitButton.disabled=false;}
    finally{submissionInProgress=false;}
  });
})();
</script>
</body>
</html>
