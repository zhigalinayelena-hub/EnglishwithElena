<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 3 — Wider World 2 Unit 3 Vocabulary</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}
*{box-sizing:border-box}body{margin:0}.container{max-width:1050px;margin:auto;padding:30px 22px 46px}
.label{text-align:center;color:#2869d8;font-size:.92rem;font-weight:bold;letter-spacing:.14em;margin:0 0 9px}h1{text-align:center;font-size:clamp(1.8rem,4vw,2.7rem);margin:0 0 8px}.subtitle{text-align:center;color:#5f6d7a;font-size:1.15rem;margin:0 0 23px}
.card{background:#fff;border-radius:20px;padding:20px 22px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:18px}.bank-title{font-size:1.1rem;color:#285887;margin:0 0 12px}.word-bank{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}.word{border:2px solid #b9d5f3;background:#edf6ff;color:#1f3552;border-radius:11px;padding:8px 12px;font-weight:bold;font-size:1rem}.word.used{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#c33333;background:#f5f7fa;color:#6b7785}.dot{color:#7b8794;font-weight:bold}
.questions{display:grid;gap:13px}.question{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border:3px solid transparent;border-radius:15px;padding:13px 16px;box-shadow:0 5px 14px rgba(0,0,0,.06);font-size:1.08rem;line-height:1.65}.question.example{background:#f7fbff}.number{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:#e6f1ff;color:#2869d8;font-size:1rem;font-weight:bold}.question input{width:145px;max-width:100%;padding:7px 10px;border:2px solid #b9d5f3;border-radius:9px;font:inherit;color:#1f3552}.question.long input{width:140px}.question.correct{border-color:#70c994;background:#f6fff8}.question.incorrect{border-color:#ee8e8e;background:#fff9f9}.question.correct input{border-color:#70c994}.question.incorrect input{border-color:#ee8e8e}.question input:disabled{background:#fff}.question .number.example-number{background:#dff8e8;color:#168344}.line-break{flex-basis:100%;margin-left:42px}.result{font-size:.94rem;font-weight:bold;width:100%;padding-left:42px}.question.correct .result{color:#168344}.question.incorrect .result{color:#c33333}
.student-entry{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 0;font-weight:bold}.student-entry.visible{display:flex}.student-entry input{font:inherit;font-weight:normal;padding:10px 12px;border:2px solid #d9e5f1;border-radius:10px;min-width:220px}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.button{border:0;border-radius:12px;background:#2869d8;color:#fff;padding:13px 24px;font-weight:bold;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}.button:hover{background:#1e56b5}.button.secondary{background:#fff;color:#2869d8;border:2px solid #2869d8}.button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}.score{background:#fff;border-radius:12px;padding:12px 18px;font-size:1.05rem;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.07)}.submit-results{display:none}.submit-results.visible{display:inline-block}.submit-results:disabled{opacity:.75;cursor:default}.feedback,.submission-status{text-align:center;min-height:27px;margin-top:12px;font-size:1rem;font-weight:bold}.feedback.good,.submission-status.good{color:#168344}.feedback.try,.submission-status.try{color:#c33333}.back{display:inline-block;margin-top:17px;color:#2869d8;text-decoration:none;font-weight:bold}.back:hover{text-decoration:underline}
@media(max-width:650px){.container{padding:24px 13px 35px}.card{padding:15px}.question{padding:11px;font-size:1rem}.question input{flex:1;min-width:115px;width:auto}.line-break{margin-left:0}.result{padding-left:0}.student-entry input{min-width:0;flex:1}}
</style>
</head>
<body>
<main class="container">
  <p class="label">UNIT 3 · VOCABULARY</p>
  <h1>Exercise 3</h1>
  <p class="subtitle">Complete the sentences with the words below.</p>
  <section class="card" aria-label="Word box">
    <h2 class="bank-title">Words</h2>
    <div class="word-bank" aria-label="beak, claws, feathers (used in the example), fur, paws, tails, wings">
      <span class="word">beak</span><span class="dot" aria-hidden="true">·</span><span class="word">claws</span><span class="dot" aria-hidden="true">·</span><span class="word used"><s>feathers</s></span><span class="dot" aria-hidden="true">·</span><span class="word">fur</span><span class="dot" aria-hidden="true">·</span><span class="word">paws</span><span class="dot" aria-hidden="true">·</span><span class="word">tails</span><span class="dot" aria-hidden="true">·</span><span class="word">wings</span>
    </div>
  </section>
  <section class="questions" aria-label="Complete the sentences">
    <div class="question example"><span class="number example-number">1</span><span>Some birds have brightly coloured <strong>feathers</strong>.</span></div>
    <label class="question"><span class="number">2</span><span>Dogs move their</span><input type="text" aria-label="Answer 2" autocomplete="off"><span>very fast when they’re happy.</span><span class="result" aria-live="polite"></span></label>
    <label class="question"><span class="number">3</span><span>Bears have different coloured</span><input type="text" aria-label="Answer 3" autocomplete="off"><span>.</span><span class="line-break">Sometimes it’s brown, sometimes white and sometimes black.</span><span class="result" aria-live="polite"></span></label>
    <label class="question"><span class="number">4</span><span>Ducks have a</span><input type="text" aria-label="Answer 4" autocomplete="off"><span>which they use to eat with.</span><span class="result" aria-live="polite"></span></label>
    <label class="question"><span class="number">5</span><span>Our dog has long</span><input type="text" aria-label="Answer 5" autocomplete="off"><span>and we have to cut them from time to time.</span><span class="result" aria-live="polite"></span></label>
    <label class="question"><span class="number">6</span><span>The</span><input type="text" aria-label="Answer 6" autocomplete="off"><span>of a butterfly are usually very pretty.</span><span class="result" aria-live="polite"></span></label>
    <label class="question"><span class="number">7</span><span>Cats walk quietly on their</span><input type="text" aria-label="Answer 7" autocomplete="off"><span>.</span><span class="result" aria-live="polite"></span></label>
  </section>
  <div class="controls"><button class="button" id="checkButton" type="button">Check Answers</button><button class="button secondary" id="retryButton" type="button">Try Again</button><div class="score" id="score" aria-live="polite">Score: 0/6</div></div>
  <div class="student-entry" id="studentEntry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name"></div>
  <div class="controls"><button class="button submit-results" id="submitButton" type="button">Submit Results</button></div>
  <div class="feedback" id="feedback" aria-live="polite"></div><div class="submission-status" id="submissionStatus" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Vocabulary</a>
</main>
<script>
(() => {
  const questions=[...document.querySelectorAll('.question:not(.example)')];
  const expected=['tails','fur','beak','claws','wings','paws'];
  const score=document.getElementById('score'),feedback=document.getElementById('feedback');
  const studentEntry=document.getElementById('studentEntry'),studentName=document.getElementById('studentName');
  const submitButton=document.getElementById('submitButton'),submissionStatus=document.getElementById('submissionStatus');
  const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
  let submittedPayload=null,submissionInProgress=false;
  function check(){
    let points=0;
    questions.forEach((question,index)=>{
      const input=question.querySelector('input');
      const correct=input.value.trim().replace(/\s+/g,' ').toLowerCase()===expected[index];
      question.classList.remove('correct','incorrect');question.classList.add(correct?'correct':'incorrect');
      input.setAttribute('aria-invalid',String(!correct));
      question.querySelector('.result').textContent=correct?'✓ Correct!':`✗ Incorrect. Correct answer: ${expected[index]}`;
      if(correct)points++;
    });
    score.textContent=`Score: ${points}/6`;
    feedback.textContent=points===6?'Excellent work! All answers are correct.':'Check your answers and try again.';
    feedback.className=`feedback ${points===6?'good':'try'}`;
    studentEntry.classList.add('visible');submitButton.classList.add('visible');submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';
  }
  function reset(){
    questions.forEach(question=>{const input=question.querySelector('input');input.value='';input.removeAttribute('aria-invalid');question.classList.remove('correct','incorrect');question.querySelector('.result').textContent='';});
    score.textContent='Score: 0/6';feedback.textContent='';feedback.className='feedback';
    studentEntry.classList.remove('visible');submitButton.classList.remove('visible');submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';submissionStatus.className='submission-status';submittedPayload=null;
  }
  document.getElementById('checkButton').addEventListener('click',check);
  document.getElementById('retryButton').addEventListener('click',reset);
  submitButton.addEventListener('click',async()=>{
    if(submissionInProgress||submitButton.disabled)return;
    const name=studentName.value.trim();
    if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='submission-status try';return;}
    const given=questions.map((question,index)=>`${index+2}: ${question.querySelector('input').value.trim()||'No answer'}`);
    const answers=`1: feathers (example); ${given.join('; ')}`;
    const payload=new URLSearchParams({student:name,unit:'Unit 3',section:'Vocabulary',exercise:'Exercise 3',answers,score:score.textContent.replace(/^Score:\s*/,'')}).toString();
    if(payload===submittedPayload){submitButton.textContent='✓ Results Submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status good';return;}
    submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';
    try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed');submittedPayload=payload;submitButton.textContent='✓ Results Submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='submission-status good';}
    catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='submission-status try';submitButton.disabled=false;}
    finally{submissionInProgress=false;}
  });
})();
</script>
</body>
</html>
