<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 5 — Clothes and accessories — Wider World 2 Unit 2</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}
*{box-sizing:border-box}body{margin:0}.container{max-width:1000px;margin:auto;padding:30px 22px 46px}
.label{text-align:center;color:#2869d8;font-size:.92rem;font-weight:bold;letter-spacing:.14em;margin:0 0 9px}h1{text-align:center;font-size:clamp(1.8rem,4vw,2.7rem);margin:0 0 8px}.subtitle{text-align:center;color:#5f6d7a;font-size:1.15rem;margin:0 0 23px}
.student-entry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;font-weight:bold}.student-entry input{font:inherit;font-weight:normal;padding:10px 12px;border:2px solid #d9e5f1;border-radius:10px;min-width:220px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:19px}.bank-title{font-size:1.15rem;color:#285887;margin:0 0 14px}.word-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.word{border:2px solid #b9d5f3;background:#edf6ff;color:#1f3552;border-radius:12px;padding:10px 14px;font-weight:bold;font-size:1rem}.questions{display:grid;gap:13px}.question{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:3px solid transparent;border-radius:15px;padding:13px 16px;box-shadow:0 5px 14px rgba(0,0,0,.06);font-size:1.08rem;line-height:1.6}.number{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:#e6f1ff;color:#2869d8;font-size:1rem;font-weight:bold}.question input{width:150px;max-width:100%;padding:8px 10px;border:2px solid #b9d5f3;border-radius:9px;font:inherit;color:#1f3552}.question.correct{border-color:#70c994;background:#f6fff8}.question.incorrect{border-color:#ee8e8e;background:#fff9f9}.question.correct input{border-color:#70c994}.question.incorrect input{border-color:#ee8e8e}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.button{border:0;border-radius:12px;background:#2869d8;color:#fff;padding:13px 24px;font-weight:bold;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}.button:hover{background:#1e56b5}.button.secondary{background:#fff;color:#2869d8;border:2px solid #2869d8}.button:disabled{opacity:.75;cursor:default}.score{background:#fff;border-radius:12px;padding:12px 18px;font-size:1.05rem;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.07)}.feedback{text-align:center;min-height:27px;margin-top:14px;font-size:1.08rem;font-weight:bold}.feedback.good{color:#168344}.feedback.try{color:#c33333}.back{display:inline-block;margin-top:17px;color:#2869d8;text-decoration:none;font-weight:bold}.back:hover{text-decoration:underline}.button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}
@media(max-width:650px){.container{padding:24px 13px 35px}.card{padding:15px}.question{padding:11px}.question input{flex:1;min-width:125px}.student-entry input{min-width:0;flex:1}}
</style>
</head>
<body>
<main class="container">
  <p class="label">UNIT 2 · VOCABULARY</p>
  <h1>Exercise 5 — Complete the sentences</h1>
  <p class="subtitle">Complete the sentences with the words below.</p>
  <div class="student-entry"><label for="studentName">Student name</label><input id="studentName" type="text" autocomplete="name"></div>
  <section class="card" aria-label="Word bank"><h2 class="bank-title">Words</h2><div class="word-bank"><span class="word">belt</span><span class="word">cotton</span><span class="word">earrings</span><span class="word">scarf</span><span class="word">shorts</span><span class="word">trainers</span><span class="word">uniform</span></div></section>
  <section class="questions" aria-label="Complete the sentences">
    <label class="question"><span class="number">1</span><span>I wear a</span><input aria-label="Answer 1" type="text" autocomplete="off"><span>to school – it’s blue.</span></label>
    <label class="question"><span class="number">2</span><span>I wear my leather</span><input aria-label="Answer 2" type="text" autocomplete="off"><span>when I play tennis.</span></label>
    <label class="question"><span class="number">3</span><span>I like your</span><input aria-label="Answer 3" type="text" autocomplete="off"><span>. They really make your ears look nice.</span></label>
    <label class="question"><span class="number">4</span><span>Helen usually wears</span><input aria-label="Answer 4" type="text" autocomplete="off"><span>T-shirts in the summer.</span></label>
    <label class="question"><span class="number">5</span><span>I need a tight</span><input aria-label="Answer 5" type="text" autocomplete="off"><span>for these jeans.</span></label>
    <label class="question"><span class="number">6</span><span>When it’s cold, my brother wears a red woolly</span><input aria-label="Answer 6" type="text" autocomplete="off"><span>.</span></label>
    <label class="question"><span class="number">7</span><span>It’s a lovely day today, so I’m wearing my</span><input aria-label="Answer 7" type="text" autocomplete="off"><span>.</span></label>
  </section>
  <div class="controls"><button class="button" id="checkButton" type="button">Check Answers</button><button class="button secondary" id="retryButton" type="button">Try Again</button><div class="score" id="score" aria-live="polite">Score: 0/7</div><button class="button secondary" id="submitButton" type="button" hidden>Submit Results</button></div>
  <div class="feedback" id="feedback" aria-live="polite"></div><div class="feedback" id="submissionStatus" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Vocabulary</a>
</main>
<script>
(() => {
  const answers=['uniform','trainers','earrings','cotton','belt','scarf','shorts'];
  const questions=[...document.querySelectorAll('.question')];
  const score=document.getElementById('score'),feedback=document.getElementById('feedback');
  const studentName=document.getElementById('studentName'),submitButton=document.getElementById('submitButton');
  const submissionStatus=document.getElementById('submissionStatus');
  const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
  let submittedPayload=null,submissionInProgress=false;
  function check(){
    let points=0;
    questions.forEach((question,index)=>{
      const input=question.querySelector('input');
      const correct=input.value.trim().replace(/\s+/g,' ').toLowerCase()===answers[index];
      question.classList.remove('correct','incorrect');question.classList.add(correct?'correct':'incorrect');
      input.setAttribute('aria-invalid',String(!correct));if(correct)points++;
    });
    score.textContent=`Score: ${points}/7`;
    feedback.textContent=points===7?'Excellent work! All answers are correct.':'Check your answers and try again.';
    feedback.className=`feedback ${points===7?'good':'try'}`;submitButton.hidden=false;submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';
  }
  function reset(){questions.forEach(q=>{q.querySelector('input').value='';q.querySelector('input').removeAttribute('aria-invalid');q.classList.remove('correct','incorrect')});score.textContent='Score: 0/7';feedback.textContent='';feedback.className='feedback';submitButton.hidden=true;submitButton.disabled=false;submitButton.textContent='Submit Results';submissionStatus.textContent='';submissionStatus.className='feedback';submittedPayload=null;}
  document.getElementById('checkButton').addEventListener('click',check);
  document.getElementById('retryButton').addEventListener('click',reset);
  submitButton.addEventListener('click',async()=>{
    if(submissionInProgress||submitButton.disabled)return;
    const name=studentName.value.trim();if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='feedback try';return;}
    const answersGiven=questions.map((q,i)=>`${i+1}: ${q.querySelector('input').value.trim()||'No answer'}`).join('; ');
    const payload=new URLSearchParams({student:name,unit:'Unit 2',section:'Vocabulary',exercise:'Exercise 5',answers:answersGiven,score:score.textContent.replace(/^Score:\s*/, '')}).toString();
    if(payload===submittedPayload){submitButton.textContent='✓ Results Submitted';submitButton.disabled=true;submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='feedback good';return;}
    submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';
    try{const response=await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload});if(response.type!=='opaque'&&!response.ok)throw new Error('Submission failed');submittedPayload=payload;submitButton.textContent='✓ Results Submitted';submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='feedback good';}
    catch(error){submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='feedback try';submitButton.disabled=false;}
    finally{submissionInProgress=false;}
  });
})();
</script>
</body>
</html>
