<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests — Unit 9</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#1f3552;}
.container{max-width:1000px;margin:auto;padding:40px 20px;}
h1{text-align:center;font-size:48px;margin:0 0 10px;}
.subtitle{text-align:center;color:#666;font-size:22px;margin:0 0 36px;}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;}
.card{display:block;background:#fff;border-radius:22px;padding:30px 20px;text-align:center;box-shadow:0 8px 18px rgba(0,0,0,.08);color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 24px rgba(0,0,0,.12);}
.category{font-size:25px;font-weight:bold;}
.unit-title{font-size:20px;font-weight:bold;margin:12px 0 30px;}
.actions{text-align:center;margin-top:32px;}
.button{display:inline-block;background:#1f3552;color:#fff;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:bold;}
.button:hover{background:#31577f;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}h1{font-size:40px;}}
@media(max-width:480px){.grid{grid-template-columns:1fr;}h1{font-size:34px;}.subtitle{font-size:20px;}}
</style>
</head>
<body>
<div class="container">
  <h1>Tests</h1>
  <p class="subtitle">Unit 9 — On the go</p>
  <section class="card" aria-label="Future Tests activities">
    <div class="category">Tests</div>
    <p>Activities coming soon.</p>
  </section>
  <div class="actions"><a class="button" href="../index.html">Back to Unit</a></div>
</div>
</body>
</html>
