<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 2 — Vocabulary — Wider World 1 Unit 1</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}
*{box-sizing:border-box}body{margin:0}.container{max-width:1000px;margin:auto;padding:34px 22px 48px}
h1{text-align:center;font-size:clamp(1.9rem,4vw,2.8rem);margin:0 0 9px}.subtitle{text-align:center;color:#5f6d7a;font-size:1.15rem;margin:0 0 24px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:20px}
h2{font-size:1.3rem;margin:0 0 15px}.word-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:45px}
.word{border:2px solid #b9d5f3;background:#edf6ff;color:#1f3552;border-radius:12px;padding:10px 16px;font-weight:bold;font-size:1rem;cursor:grab;touch-action:manipulation;user-select:none}
.word:hover{background:#dceeff}.word.selected{outline:3px solid #2869d8;background:#dceeff}.word:focus-visible,.item:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:18px}.group{background:#f7faff;border:1px solid #d9e5f1;border-radius:17px;padding:17px}.group h2{color:#285887;margin:0 0 12px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e1eaf3;border-radius:13px;padding:12px;margin-top:10px;min-height:60px;transition:border-color .15s,background .15s}.item.drag-over{border-color:#2869d8;background:#f1f7ff}
.number{font-weight:bold;font-size:1.05rem;flex:0 0 26px}.phrase{font-size:1.08rem;font-weight:bold;min-width:0;flex:1}.blank{display:inline-flex;min-width:88px;min-height:34px;align-items:center;justify-content:center;border-bottom:3px dashed #89a5c1;color:#2869d8;padding:2px 5px}.item.has-word .blank{border-bottom-style:solid;background:#edf6ff;border-radius:7px 7px 0 0}.item.correct{border-color:#219653;background:#f0fff5}.item.incorrect{border-color:#d84343;background:#fff4f4}.result{flex-basis:100%;font-size:.9rem;font-weight:bold;min-height:20px;margin-left:36px}.item.correct .result{color:#168344}.item.incorrect .result{color:#c33333}
.item{flex-wrap:wrap}.item .number{align-self:flex-start;padding-top:4px}.item .phrase{align-self:center}.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.button{border:0;border-radius:12px;background:#2869d8;color:#fff;padding:13px 24px;font-weight:bold;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}.button:hover{background:#1e56b5}.button.secondary{background:#fff;color:#2869d8;border:2px solid #2869d8}.score{background:#fff;border-radius:12px;padding:12px 18px;font-size:1.05rem;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.feedback{text-align:center;min-height:30px;margin-top:15px;font-size:1.12rem;font-weight:bold}.feedback.good{color:#168344}.feedback.try{color:#c33333}.back{display:inline-block;margin-top:22px;color:#2869d8;text-decoration:none;font-weight:bold}.back:hover{text-decoration:underline}
@media(max-width:650px){.container{padding:25px 14px 36px}.card{padding:16px}.groups{grid-template-columns:1fr}.item{gap:7px}.phrase{font-size:1rem}.blank{min-width:72px}}
</style>
</head>
<body>
<main class="container">
  <h1>Exercise 2: Complete the classroom objects</h1>
  <p class="subtitle">Complete the classroom objects with these words.</p>

  <section class="card" aria-labelledby="word-bank-title">
    <h2 id="word-bank-title">Word bank</h2>
    <div class="word-bank" id="wordBank" aria-label="Word bank"></div>
  </section>

  <section class="card" aria-label="Complete the classroom objects">
    <div class="groups">
      <section class="group" aria-labelledby="two-words-title">
        <h2 id="two-words-title">TWO WORDS</h2>
        <div class="item" data-answer="case" tabindex="0" role="button" aria-label="1. pencil blank"><span class="number">1.</span><span class="phrase">pencil <span class="blank">______</span></span><span class="result" aria-live="polite"></span></div>
        <div class="item" data-answer="bin" tabindex="0" role="button" aria-label="2. rubbish blank"><span class="number">2.</span><span class="phrase">rubbish <span class="blank">______</span></span><span class="result" aria-live="polite"></span></div>
        <div class="item" data-answer="sports" tabindex="0" role="button" aria-label="3. blank bag"><span class="number">3.</span><span class="phrase"><span class="blank">______</span> bag</span><span class="result" aria-live="polite"></span></div>
      </section>
      <section class="group" aria-labelledby="one-word-title">
        <h2 id="one-word-title">ONE WORD</h2>
        <div class="item" data-answer="text" tabindex="0" role="button" aria-label="4. blank book"><span class="number">4.</span><span class="phrase"><span class="blank">______</span> book</span><span class="result" aria-live="polite"></span></div>
        <div class="item" data-answer="book" tabindex="0" role="button" aria-label="5. note blank"><span class="number">5.</span><span class="phrase">note<span class="blank">______</span></span><span class="result" aria-live="polite"></span></div>
        <div class="item" data-answer="white" tabindex="0" role="button" aria-label="6. blank board"><span class="number">6.</span><span class="phrase"><span class="blank">______</span> board</span><span class="result" aria-live="polite"></span></div>
      </section>
    </div>
  </section>

  <div class="controls">
    <button class="button" id="checkButton" type="button">Check</button>
    <button class="button secondary" id="retryButton" type="button">Try again</button>
    <div class="score" id="score" aria-live="polite">Score: 0/6</div>
  </div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Vocabulary</a>
</main>
<script>
(() => {
  const words = ['bin','book','case','sports','text','white'];
  const bank = document.getElementById('wordBank');
  const items = [...document.querySelectorAll('.item')];
  const score = document.getElementById('score');
  const feedback = document.getElementById('feedback');
  let selectedWord = null;
  let checked = false;

  function clearSelection(){
    selectedWord = null;
    document.querySelectorAll('.word.selected').forEach(word => word.classList.remove('selected'));
  }
  function makeWord(word){
    const chip = document.createElement('div');
    chip.className='word';chip.textContent=word;chip.draggable=true;chip.tabIndex=0;
    chip.setAttribute('role','button');chip.setAttribute('aria-label',`Select ${word}`);
    chip.addEventListener('dragstart',event=>{event.dataTransfer.setData('text/plain',word);event.dataTransfer.effectAllowed='move';selectChip(chip);});
    chip.addEventListener('click',()=>selectChip(chip));
    chip.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectChip(chip);}});
    return chip;
  }
  function selectChip(chip){document.querySelectorAll('.word.selected').forEach(item=>item.classList.remove('selected'));chip.classList.add('selected');selectedWord=chip;}
  function placeWord(item,word){
    if(!words.includes(word))return;
    if(item.dataset.word===word)return;
    if(item.dataset.word){
      bank.appendChild(makeWord(item.dataset.word));
      delete item.dataset.word;
      item.querySelector('.blank').textContent='______';
      item.classList.remove('has-word');
    }
    const source=[...bank.querySelectorAll('.word')].find(chip=>chip.textContent===word);
    if(!source)return;
    source.remove();item.dataset.word=word;item.querySelector('.blank').textContent=word;item.classList.add('has-word');item.classList.remove('correct','incorrect');item.querySelector('.result').textContent='';clearSelection();
    if(checked)checkAnswers();
  }
  function chooseItem(item){
    if(selectedWord){placeWord(item,selectedWord.textContent);return;}
    if(item.dataset.word){bank.appendChild(makeWord(item.dataset.word));delete item.dataset.word;item.querySelector('.blank').textContent='______';item.classList.remove('has-word','correct','incorrect');item.querySelector('.result').textContent='';if(checked)checkAnswers();}
  }
  items.forEach(item=>{
    item.addEventListener('dragover',event=>{event.preventDefault();item.classList.add('drag-over');});
    item.addEventListener('dragleave',()=>item.classList.remove('drag-over'));
    item.addEventListener('drop',event=>{event.preventDefault();item.classList.remove('drag-over');placeWord(item,event.dataTransfer.getData('text/plain'));});
    item.addEventListener('click',()=>chooseItem(item));
    item.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseItem(item);}});
  });
  function checkAnswers(){
    checked=true;let points=0;
    items.forEach(item=>{
      const correct=item.dataset.word===item.dataset.answer;
      item.classList.remove('correct','incorrect');item.classList.add(correct?'correct':'incorrect');
      item.querySelector('.result').textContent=correct?'✅ Correct!':`❌ Try again. Correct answer: ${item.dataset.answer}.`;
      if(correct)points++;
    });
    score.textContent=`Score: ${points}/6`;
    feedback.textContent=points===6?'Excellent work! All answers are correct.':'Check the feedback on each item and try again.';
    feedback.className=`feedback ${points===6?'good':'try'}`;
  }
  function reset(){
    bank.replaceChildren(...words.map(makeWord));
    items.forEach(item=>{delete item.dataset.word;item.querySelector('.blank').textContent='______';item.querySelector('.result').textContent='';item.classList.remove('has-word','correct','incorrect','drag-over');});
    clearSelection();checked=false;score.textContent='Score: 0/6';feedback.textContent='';feedback.className='feedback';
  }
  document.getElementById('checkButton').addEventListener('click',checkAnswers);
  document.getElementById('retryButton').addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
