<style>
:root{font-family:Arial,sans-serif;color:#1f3552;background:#eef3f8}
*{box-sizing:border-box}body{margin:0}.container{max-width:1000px;margin:auto;padding:34px 22px 48px}
.label{text-align:center;color:#2869d8;font-size:.95rem;font-weight:bold;letter-spacing:.14em;margin:0 0 10px}h1{text-align:center;font-size:clamp(1.7rem,4vw,2.55rem);margin:0 0 9px}.subtitle{text-align:center;color:#5f6d7a;font-size:1.12rem;line-height:1.5;margin:0 0 24px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:20px}.word-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.word{border:2px solid #b9d5f3;background:#edf6ff;color:#1f3552;border-radius:12px;padding:10px 16px;font-weight:bold;font-size:1rem}
.pictures{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.picture{min-width:0;border:2px solid #e1eaf3;border-radius:14px;overflow:hidden;background:#f7faff}.picture svg{display:block;width:100%;height:auto;aspect-ratio:150/100}.picture-caption{padding:8px;text-align:center;font-weight:bold;background:#edf6ff}
.questions{display:grid;gap:12px}.question{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;background:#f7faff;border:2px solid #e1eaf3;border-radius:14px;padding:13px 15px}.number{font-weight:bold;padding-top:7px}.sentence{font-size:1.08rem;line-height:1.65}.answer-input{width:130px;max-width:34vw;border:0;border-bottom:3px dashed #89a5c1;border-radius:0;background:transparent;color:#1f3552;font:inherit;font-weight:bold;padding:2px 7px;text-align:center;text-transform:lowercase}.answer-input.letter{width:62px;text-transform:uppercase}.answer-input:focus{outline:2px solid #9ec9f4;background:#f3f9ff;border-radius:6px}.answer-input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}.question.correct{border-color:#219653;background:#f0fff5}.question.incorrect{border-color:#d84343;background:#fff4f4}.result{display:block;min-height:20px;margin-top:7px;font-size:.9rem;font-weight:bold}.question.correct .result{color:#168344}.question.incorrect .result{color:#c33333}
.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px}.button{border:0;border-radius:12px;background:#2869d8;color:#fff;padding:13px 24px;font-weight:bold;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}.button:hover{background:#1e56b5}.button.secondary{background:#fff;color:#2869d8;border:2px solid #2869d8}.button:disabled{opacity:.65;cursor:default}.score{background:#fff;border-radius:12px;padding:12px 18px;font-size:1.05rem;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.feedback{text-align:center;min-height:30px;margin-top:15px;font-size:1.08rem;font-weight:bold}.feedback.good{color:#168344}.feedback.try{color:#c33333}.student-entry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;font-weight:bold}.student-entry input{font:inherit;font-weight:normal;padding:10px 12px;border:2px solid #d9e5f1;border-radius:10px;min-width:220px}.back{display:inline-block;margin-top:22px;color:#2869d8;text-decoration:none;font-weight:bold}.back:hover{text-decoration:underline}
@media(max-width:700px){.container{padding:25px 14px 36px}.card{padding:15px}.pictures{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.picture-caption{padding:6px}.question{padding:11px 9px;gap:7px}.sentence{font-size:1rem;line-height:2}}
@media(max-width:420px){.pictures{grid-template-columns:repeat(2,minmax(0,1fr))}.answer-input{width:105px}.answer-input.letter{width:52px}}
</style>

  <section class="card questions" aria-label="Complete the phrases and match pictures">
    <div class="question" data-verb="go" data-picture="B"><span class="number">1.</span><div><div class="sentence"><input class="answer-input" type="text" aria-label="Verb for phrase 1" autocomplete="off" autocapitalize="none" spellcheck="false"> to school &nbsp; Picture <input class="answer-input letter" type="text" aria-label="Picture letter for phrase 1" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><span class="result" aria-live="polite"></span></div></div>
    <div class="question" data-verb="start" data-picture="D"><span class="number">2.</span><div><div class="sentence"><input class="answer-input" type="text" aria-label="Verb for phrase 2" autocomplete="off" autocapitalize="none" spellcheck="false"> school &nbsp; Picture <input class="answer-input letter" type="text" aria-label="Picture letter for phrase 2" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><span class="result" aria-live="polite"></span></div></div>
    <div class="question" data-verb="revise" data-picture="E"><span class="number">3.</span><div><div class="sentence"><input class="answer-input" type="text" aria-label="Verb for phrase 3" autocomplete="off" autocapitalize="none" spellcheck="false"> for exams &nbsp; Picture <input class="answer-input letter" type="text" aria-label="Picture letter for phrase 3" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><span class="result" aria-live="polite"></span></div></div>
    <div class="question" data-verb="do" data-picture="A"><span class="number">4.</span><div><div class="sentence"><input class="answer-input" type="text" aria-label="Verb for phrase 4" autocomplete="off" autocapitalize="none" spellcheck="false"> homework &nbsp; Picture <input class="answer-input letter" type="text" aria-label="Picture letter for phrase 4" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><span class="result" aria-live="polite"></span></div></div>
    <div class="question" data-verb="have" data-picture="C"><span class="number">5.</span><div><div class="sentence"><input class="answer-input" type="text" aria-label="Verb for phrase 5" autocomplete="off" autocapitalize="none" spellcheck="false"> classes &nbsp; Picture <input class="answer-input letter" type="text" aria-label="Picture letter for phrase 5" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><span class="result" aria-live="polite"></span></div></div>
  </section>

  <div class="controls">
    <button class="button" id="checkButton" type="button">Check</button>
    <button class="button secondary" id="retryButton" type="button">Try again / Reset</button>
    <div class="score" id="score" aria-live="polite">Score: 0/5</div>
    <button class="button secondary" id="submitButton" type="button" hidden>Submit Results</button>
  </div>
  <div class="feedback" id="submissionStatus" aria-live="polite"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Listening</a>
</main>
<script>
(() => {
  const questions=[...document.querySelectorAll('.question')];
  const score=document.getElementById('score');
  const feedback=document.getElementById('feedback');
  const submitButton=document.getElementById('submitButton');
  const submissionStatus=document.getElementById('submissionStatus');
  const studentName=document.getElementById('studentName');
  const inputs=[...document.querySelectorAll('.answer-input')];
  const webAppUrl='https://script.google.com/macros/s/AKfycbwPTqHGfAnL8tFUJ8A9LM6Kp2XDx8dyICSOufLuagbBvaw9RiQd8AMLdtKMmYxf0nUx/exec';
  let checked=false;
  let submissionInProgress=false;
  function checkAnswers(){
    checked=true;
    let points=0;
    questions.forEach(question=>{
      const [verbInput,pictureInput]=question.querySelectorAll('.answer-input');
      const verbCorrect=verbInput.value.trim().toLowerCase()===question.dataset.verb;
      const pictureCorrect=pictureInput.value.trim().toUpperCase()===question.dataset.picture;
      const correct=verbCorrect&&pictureCorrect;
      question.classList.remove('correct','incorrect');
      question.classList.add(correct?'correct':'incorrect');
      const corrections=[];
      if(!verbCorrect)corrections.push(`verb: ${question.dataset.verb}`);
      if(!pictureCorrect)corrections.push(`picture: ${question.dataset.picture}`);
      question.querySelector('.result').textContent=correct?'✓ Correct!':`✗ Check your ${corrections.join(' and ')}.`;
      if(correct)points++;
    });
    score.textContent=`Score: ${points}/5`;
    submitButton.hidden=false;
    feedback.textContent=points===5?'Excellent work! All answers are correct.':'Check the feedback for each phrase and try again.';
    feedback.className=`feedback ${points===5?'good':'try'}`;
  }
  function reset(){
    inputs.forEach(input=>{input.value='';});
    questions.forEach(question=>{question.classList.remove('correct','incorrect');question.querySelector('.result').textContent='';});
    checked=false;
    score.textContent='Score: 0/5';
    feedback.textContent='';feedback.className='feedback';
    submitButton.hidden=true;submitButton.disabled=false;submitButton.textContent='Submit Results';
    submissionStatus.textContent='';submissionStatus.className='feedback';
  }
  inputs.forEach(input=>input.addEventListener('input',()=>{if(checked)checkAnswers();}));
  submitButton.addEventListener('click',async()=>{
    if(submissionInProgress||submitButton.disabled)return;
    if(!checked){submissionStatus.textContent='Check your answers before submitting.';submissionStatus.className='feedback try';return;}
    const name=studentName.value.trim();
    if(!name){studentName.focus();submissionStatus.textContent='Please enter your name.';submissionStatus.className='feedback try';return;}
    const answers=questions.map((question,index)=>{
      const [verb,picture]=question.querySelectorAll('.answer-input');
      return `${index+1}: ${verb.value.trim()||'No verb'}; picture ${picture.value.trim().toUpperCase()||'No answer'}`;
    }).join('; ');
    const data=new URLSearchParams({student:name,unit:'Unit 4',section:'Listening',exercise:'Exercise 1',answers,score:score.textContent.replace(/^Score:\s*/,'')});
    submissionInProgress=true;submitButton.disabled=true;submissionStatus.textContent='';
    try{
      await fetch(webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:data.toString()});
      submitButton.textContent='✓ Results submitted';
      submissionStatus.textContent='Results submitted successfully!';submissionStatus.className='feedback good';
    }catch(error){
      submissionStatus.textContent='Sorry, the results could not be submitted. Please try again.';submissionStatus.className='feedback try';submitButton.disabled=false;
    }finally{submissionInProgress=false;}
  });
  document.getElementById('checkButton').addEventListener('click',checkAnswers);
  document.getElementById('retryButton').addEventListener('click',reset);
  reset();
})();
</script>
